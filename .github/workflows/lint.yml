name: Lint workflows

on:
  pull_request:
  # Called by cicd.yml so that a release depends on the lint result (no separate push trigger).
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # Pre-existing shellcheck info/style findings (unquoted variables, etc.) are ignored
          # until they are cleaned up; every other actionlint/shellcheck finding fails the job.
          args: -color -ignore SC2086 -ignore SC2016 -ignore SC2129

      - name: Check composite actions are valid YAML with a runs block
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("actions/**/action.yml", recursive=True)):
              doc = yaml.safe_load(open(f))
              if "runs" not in doc or "on" in doc or True in doc:
                  print(f"::error file={f}::not a valid composite action (missing runs: or workflow-only keys)")
                  bad = 1
          sys.exit(bad)
          PY

  # [NOUVEAU] MAIR-285: unit tests of the GDPR inventory gate (tests/gdpr, no database, the
  # Anthropic client is mocked).
  gdpr:
    name: GDPR checks tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/gdpr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

  # [NOUVEAU] MAIR-291: the GDPR Semgrep rules against their annotated test files.
  semgrep-rules:
    name: GDPR Semgrep rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same pinned image as actions/semgrep.
      - name: Test the rules
        run: |
          image=$(sed -n 's/^ *default: "\(semgrep\/semgrep:[^"]*\)".*/\1/p' actions/semgrep/action.yml)
          docker run --rm -v "$PWD/tests/semgrep:/src/semgrep:ro" -w /src "$image" \
            semgrep --test --metrics=off --disable-version-check semgrep/gdpr
