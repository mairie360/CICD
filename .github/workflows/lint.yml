name: Lint workflows

on:
  pull_request:
  # Called by cicd.yml so that a release depends on the lint result (no separate push trigger).
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows with the verified published binary
        run: |
          set -euo pipefail
          frontend_actionlint_directory=$(mktemp -d "$RUNNER_TEMP/frontend-actionlint.XXXXXX")
          curl --fail --show-error --location \
            --output "$frontend_actionlint_directory/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$frontend_actionlint_directory/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$frontend_actionlint_directory/actionlint.tar.gz" -C "$frontend_actionlint_directory" actionlint
          # No shellcheck exclusion (MAIR-542): SC2086, SC2016 and SC2129 are enforced again.
          "$frontend_actionlint_directory/actionlint" -color

      - name: Check composite actions are valid YAML with a runs block
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("actions/**/action.yml", recursive=True)):
              doc = yaml.safe_load(open(f))
              if "runs" not in doc or "on" in doc or True in doc:
                  print(f"::error file={f}::not a valid composite action (missing runs: or workflow-only keys)")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Test the frontend dev exception guards
        run: python3 -m unittest discover -s actions/release/frontend-dev-exception/tests -v

      - name: Test the frontend scanner evidence and verdict guards
        run: python3 -m unittest discover -s actions/security/semgrep-pypi/tests -v

      - name: Test isolated frontend target selection
        run: python3 -m unittest discover -s actions/integration/frontend-isolated-qa/tests -v

      - name: Test the newman report summary of the BFF integration gate
        run: python3 -m unittest discover -s actions/integration/bffs/tests -v

      - name: Test the release journal
        run: python3 -m unittest discover -s actions/release/release-journal/tests -v

      - name: Test the promotion commit resolution
        run: python3 -m unittest discover -s actions/promote/resolve/tests -v

      # MAIR-998: the test stacks follow the moving tag of the stage; their digests are logged.
      - name: Upstream images action tests
        run: python3 -m unittest discover -s actions/integration/upstream-images/tests -v

      # MAIR-1005: a prod promotion refuses internal pins that are not released.
      - name: Test the internal pin check
        run: python3 -m unittest discover -s actions/promote/verify-pins/tests -v

      # MAIR-1008: when the nightly rehearsal of the promotion gates runs.
      - name: Test the nightly gates check
        run: python3 -m unittest discover -s actions/promote/nightly-check/tests -v

      # MAIR-542: the OpenAPI coverage gates shared by every API and BFF repo.
      - name: Test the ZAP OpenAPI coverage hooks
        run: python3 -m unittest discover -s tests/zap -v

      - name: Test the k6 OpenAPI coverage helper
        run: node --test tests/k6/coverage.test.mjs

      - name: Test the next-version mirror
        run: python3 -m unittest discover -s actions/promote/next-version/tests -v

      - name: Test the tag and release creation
        run: python3 -m unittest discover -s actions/promote/create-release/tests -v

      # MAIR-999: the promotions republish the dev / staging OpenAPI package instead of compiling it.
      - name: Test the OpenAPI package promotion
        run: python3 -m unittest discover -s actions/release/promote-openapi/tests -v

      # MAIR-1009: one front build on main, node_modules restored from the cache in every job.
      - name: Test the node_modules cache and the single front build
        run: python3 -m unittest discover -s actions/dependencies/node-install/tests -v

      - name: Test the npm audit split of the BFFs and bffs-lib
        run: python3 -m unittest discover -s actions/dependencies/bffs/tests -v

      - name: Test the fronts' end-to-end gate (MAIR-602)
        run: python3 -m unittest discover -s actions/e2e/fronts/tests -v

      # The GDPR gates stay wired into promote-prod, and only there.
      - name: Test the wiring of the GDPR prod gates
        run: python3 -m unittest discover -s actions/promote/gdpr-gates/tests -v

      # MAIR-321: accessibility section of the fronts' prod releases.
      - name: Test the accessibility section of the release
        run: python3 -m unittest discover -s actions/release/accessibility-section/tests -v

      # MAIR-677: range scanned when the push base is unknown, inline allow ignored.
      - name: Test the secret-scan range and flags
        run: python3 -m unittest discover -s actions/security/gitleaks/tests -v

  # MAIR-542: audit of the workflows (unpinned actions, template injection, excessive permissions).
  # Non-blocking for now: findings are reported in the log until the existing ones are triaged.
  zizmor:
    name: zizmor workflow audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit workflows and composite actions
        run: |
          # Neither an install failure nor the findings fail the job until the existing ones are triaged: a red check would hide real failures.
          {
            pip install --user --quiet zizmor==1.5.2 \
              && "$HOME/.local/bin/zizmor" --no-progress --persona=regular .github/workflows actions
          } || echo "::warning::zizmor could not run or reported findings (non-blocking, see the log above)"

  frontend-exception-security:
    name: frontend dev exception source scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only the new frontend release policy and workflow
        uses: ./actions/security/semgrep-pypi
        with:
          config: p/python p/secrets p/github-actions
          paths: actions/release/frontend-dev-exception actions/security/semgrep-pypi actions/security/gitleaks-binary actions/integration/frontend-isolated-qa .github/workflows/frontend-dev-exception.yml .github/workflows/frontend-cicd.yml .github/workflows/frontend-isolated-qa.yml
          exclude: ''
          fail_on_findings: 'true'
          artifact_name: frontend-dev-exception-sarif
      - name: Scan new commits for secrets
        uses: ./actions/security/gitleaks-binary
        with:
          fail_on_findings: 'true'

  # [NOUVEAU] MAIR-285: unit tests of the GDPR inventory gate (tests/gdpr, no database, the
  # Anthropic client is mocked).
  gdpr:
    name: GDPR checks tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/gdpr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          # The browser comes with the Playwright image (end-to-end step below).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Test
        run: npm test

      # [NOUVEAU] MAIR-292: the browser checks (tests/gdpr/privacy) on real pages, inside the pinned
      # Playwright image, on a copy of the package with its own node_modules.
      - name: Run the browser end-to-end tests
        run: |
          docker run --rm -v "$PWD:/engine:ro" -e GDPR_E2E=1 "$(cat privacy/runner-image)" sh -c \
            'mkdir /tmp/engine && tar -C /engine --exclude=./node_modules -cf - . | tar -C /tmp/engine -xf - && cd /tmp/engine && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund --loglevel=error && node --test privacy/*.test.mjs'

  # [NOUVEAU] MAIR-291: the GDPR Semgrep rules against their annotated test files.
  semgrep-rules:
    name: GDPR Semgrep rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same pinned image as actions/security/semgrep.
      - name: Test the rules
        run: |
          image=$(sed -n 's/^ *default: "\(semgrep\/semgrep:[^"]*\)".*/\1/p' actions/security/semgrep/action.yml)
          docker run --rm -v "$PWD/tests/semgrep:/src/semgrep:ro" -w /src "$image" \
            semgrep --test --metrics=off --disable-version-check semgrep/gdpr

  # [NOUVEAU] MAIR-316: the rgaa.yaml schema and its validator are consumed by every front and by
  # lib-components; their tests (and the examples, which document the format) must stay green.
  a11y:
    name: RGAA engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/a11y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/a11y/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # The browsers come with the runner image (end-to-end step below).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Run tests
        run: npm test

      - name: Validate the examples
        run: node validate.mjs examples/*.rgaa.yaml

      # [NOUVEAU] MAIR-317: plays states in a real browser, inside the pinned runner image the
      # consumers use, on a copy of the engine with its own node_modules (as run.sh does).
      - name: Run end-to-end tests in the runner image
        run: |
          docker run --rm -v "$PWD:/engine:ro" -e RGAA_E2E=1 "$(cat runner-image)" sh -c \
            'mkdir /tmp/engine && tar -C /engine --exclude=./node_modules -cf - . | tar -C /tmp/engine -xf - && cd /tmp/engine && npm ci --no-audit --no-fund --loglevel=error && node --test'
