name: Lint workflows

on:
  pull_request:
  # Called by cicd.yml so that a release depends on the lint result (no separate push trigger).
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # Pre-existing shellcheck info/style findings (unquoted variables, etc.) are ignored
          # until they are cleaned up; every other actionlint/shellcheck finding fails the job.
          args: -color -ignore SC2086 -ignore SC2016 -ignore SC2129

      - name: Check composite actions are valid YAML with a runs block
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("actions/**/action.yml", recursive=True)):
              doc = yaml.safe_load(open(f))
              if "runs" not in doc or "on" in doc or True in doc:
                  print(f"::error file={f}::not a valid composite action (missing runs: or workflow-only keys)")
                  bad = 1
          sys.exit(bad)
          PY

  # [NOUVEAU] MAIR-316: the rgaa.yaml schema and its validator are consumed by every front and by
  # lib-components; their tests (and the examples, which document the format) must stay green.
  a11y:
    name: RGAA engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/a11y
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/a11y/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # The browsers come with the runner image (end-to-end step below).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Run tests
        run: npm test

      - name: Validate the examples
        run: node validate.mjs examples/*.rgaa.yaml

      # [NOUVEAU] MAIR-317: plays states in a real browser, inside the pinned runner image the
      # consumers use (its node_modules are reinstalled there, as run.sh does).
      - name: Run end-to-end tests in the runner image
        run: |
          docker run --rm -v "$PWD:/engine" -w /engine -e RGAA_E2E=1 "$(cat runner-image)" \
            sh -c 'npm ci --no-audit --no-fund --loglevel=error && node --test'
