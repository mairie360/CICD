name: Lint workflows

on:
  pull_request:
  # Called by cicd.yml so that a release depends on the lint result (no separate push trigger).
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # Pre-existing shellcheck info/style findings (unquoted variables, etc.) are ignored
          # until they are cleaned up; every other actionlint/shellcheck finding fails the job.
          args: -color -ignore SC2086 -ignore SC2016 -ignore SC2129

      - name: Check composite actions are valid YAML with a runs block
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("actions/**/action.yml", recursive=True)):
              doc = yaml.safe_load(open(f))
              if "runs" not in doc or "on" in doc or True in doc:
                  print(f"::error file={f}::not a valid composite action (missing runs: or workflow-only keys)")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Test the frontend dev exception guards
        run: python3 -m unittest discover -s actions/frontend-dev-exception/tests -v

  frontend-exception-security:
    name: frontend dev exception source scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only the new frontend release policy and workflow
        uses: ./actions/semgrep
        with:
          config: p/python p/secrets p/github-actions
          paths: actions/frontend-dev-exception .github/workflows/frontend-dev-exception.yml
          exclude: ''
          fail_on_findings: 'true'
          artifact_name: frontend-dev-exception-sarif
      - name: Scan new commits for secrets
        uses: ./actions/gitleaks
        with:
          fail_on_findings: 'true'
