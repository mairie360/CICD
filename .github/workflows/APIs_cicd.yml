name: APIs CICD

on:
  workflow_call:
    inputs:
      postman_collection:
        required: true
        type: string
      postman_environment:
        required: true
        type: string
      package_name:
        required: false
        type: string
        description: "Image base name"
      cicd_version:
        required: true
        type: string
    secrets:
      POSTMAN_API_KEY:
        required: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [CHANGEMENT] Remplacement de actions-rs/toolchain (obsolète) par dtolnay/rust-toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # [CHANGEMENT] Remplacement du cache manuel par Swatinem/rust-cache@v2
      # qui gère automatiquement et efficacement les dépendances et le cache Cargo.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download Dependencies
        run: cargo fetch

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # [CHANGEMENT] Utilisation de la commande cargo standard au lieu de l'action-rs/cargo
      - name: Run lint check
        run: cargo clippy -- -D warnings

  build:
    name: Build Project & Spec
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Project
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-assets
          path: |
            target/release/
            openapi-spec.json
          retention-days: 1 # [CHANGEMENT] Limitation de la rétention pour économiser l'espace

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Tests
        run: cargo test

  integration_tests:
    name: Postman Tests
    runs-on: ubuntu-latest
    needs: unit_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and start services
        run: docker compose up -d --build

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Postman tests
        run: |
          postman collection run "${{ inputs.postman_collection }}" \
            -e "${{ inputs.postman_environment }}" \
            --bail

      - name: Tear down
        if: always()
        run: docker compose down

  release-dev:
    if: github.ref == 'refs/heads/main'
    needs: integration_tests
    environment: Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate Tags
        id: meta
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "db_repo=$REPO/${{ inputs.package_name }}" >> $GITHUB_OUTPUT
          echo "liq_repo=$REPO/liquibase-migrations" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      # [CHANGEMENT] Configuration de Buildx et ajout du cache GHA pour Docker
      # afin de réutiliser les couches d'une exécution à l'autre et accélérer le build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (Dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.package_name }}:dev-${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.package_name }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev-${{ steps.meta.outputs.sha_tag }}
          spec_file: ./openapi-spec.json

  release-staging:
    needs: release-dev
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate Tags
        id: meta
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "db_repo=$REPO/${{ inputs.package_name }}" >> $GITHUB_OUTPUT
          echo "liq_repo=$REPO/liquibase-migrations" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Promote to Staging
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          docker pull $REPO/${{ inputs.package_name }}:dev-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:dev-$SHA_TAG $REPO/${{ inputs.package_name }}:staging-$SHA_TAG
          docker push $REPO/${{ inputs.package_name }} --all-tags

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-staging.${{ steps.meta.outputs.sha_tag }}
          spec_file: ./openapi-spec.json

  release-prod:
    needs: release-staging
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      TAG: ${{ steps.set_tag.outputs.new_release_version }}
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      - name: Log in to GHCR
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Promote to Prod
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TAG=${{ steps.set_tag.outputs.new_release_version }}
          docker pull $REPO/${{ inputs.package_name }}:staging-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:staging-$SHA_TAG $REPO/${{ inputs.package_name }}:$TAG
          docker tag $REPO/${{ inputs.package_name }}:staging-$SHA_TAG $REPO/${{ inputs.package_name }}:latest
          docker push $REPO/${{ inputs.package_name }} --all-tags

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.set_tag.outputs.new_release_version }}
          spec_file: ./openapi-spec.json
