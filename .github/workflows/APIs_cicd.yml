name: APIs CICD

on:
  workflow_call:
    inputs:
      postman_collection:
        required: true
        type: string
      postman_environment:
        required: true
        type: string
      package_name:
        required: false
        type: string
        description: "Image base name"
      cicd_version:
        required: true
        type: string
    secrets:
      POSTMAN_API_KEY:
        required: true
      # [NOUVEAU] Requis pour l'upload de couverture vers Codecov (aligné sur back-lib-cicd.yml)
      CODECOV_TOKEN:
        required: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download Dependencies
        run: cargo fetch

      - name: Security Audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # [CHANGEMENT] Utilisation de la commande cargo standard au lieu de l'action-rs/cargo
      - name: Run lint check
        run: cargo clippy -- -D warnings

  build:
    name: Build Project & Spec
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Project
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-assets
          path: |
            target/release/
            openapi-spec.json
          retention-days: 1 # [CHANGEMENT] Limitation de la rétention pour économiser l'espace

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] Dépend de `lint` et non de `build` : le job ne consomme pas l'artefact
    # de build et recompile de toute façon en mode instrumenté. Il tourne donc en parallèle
    # de `build`. Les tests unitaires ne sont exécutés qu'une seule fois, via `cargo cov`.
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # [CHANGEMENT] Installation via taiki-e/install-action (plus rapide que `cargo install`),
      # aligné sur back-lib-cicd.yml.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # [CHANGEMENT] Passe par l'alias cargo `cov` défini par le repo consommateur
      # (aligné sur la convention `cargo lint_check`). L'alias doit exécuter les tests,
      # appliquer le seuil de couverture et produire `codecov.json` pour l'upload ci-dessous.
      - name: Run Rust Tests & Check Coverage
        run: cargo cov

      # [NOUVEAU] Upload de la couverture vers Codecov (copié de back-lib-cicd.yml),
      # uniquement sur main ou sur une PR ciblant main.
      - name: Envoyer à Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  release-dev:
    if: github.ref == 'refs/heads/main'
    # [CHANGEMENT] `build` ajouté explicitement : `unit_test` ne dépend plus de `build`,
    # or ce job consomme l'artefact `api-assets`.
    needs: [unit_test, build]
    environment: Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Logique Docker (build unique + push dev-<sha> / dev-latest)
      # centralisée dans l'action composite partagée `docker-release`.
      - name: Build & Push image (Dev)
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev-${{ steps.release.outputs.sha_tag }}
          spec_file: ./openapi-spec.json

  integration_tests:
    if: github.ref == 'refs/heads/main'
    name: Postman Tests
    runs-on: ubuntu-latest
    needs: release-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and start services
        run: docker compose up -d --build

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Postman tests
        run: |
          postman collection run "${{ inputs.postman_collection }}" \
            -e "${{ inputs.postman_environment }}" \
            --bail

      - name: Tear down
        if: always()
        run: docker compose down

  integration_and_security:
    if: github.ref == 'refs/heads/main'
    needs: release-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and run tests via Docker Compose
        run: |
          # Lance le compose. --exit-code-from security-scan fait échouer le job
          # si Newman échoue OU si ZAP détecte une vulnérabilité.
          docker compose -f docker-compose.test.yml up --build --exit-code-from security-scan

      - name: Clean up Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  performance_isolated:
    if: github.ref == 'refs/heads/main'
    name: Isolated Performance Test
    runs-on: ubuntu-latest
    needs: release-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate Tags
        id: meta
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_tag=$REPO/${{ inputs.package_name }}:dev-$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Run Performance Tests via Docker Compose
        run: |
          export TARGET_IMAGE="${{ steps.meta.outputs.image_tag }}"
          # --exit-code-from k6-perf-test fait échouer le job si k6 dépasse les seuils
          docker compose -f docker-compose.test.yml up --build --exit-code-from k6-perf-test

      - name: Clean up Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  release-staging:
    needs: [integration_and_security, integration_tests, performance_isolated]
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Re-tag dev -> staging centralisé dans l'action composite `docker-release`.
      # Ajoute au passage le tag `staging-latest` (auparavant absent pour la stack API).
      - name: Promote image to Staging
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-staging.${{ steps.release.outputs.sha_tag }}
          spec_file: ./openapi-spec.json

  release-prod:
    needs: release-staging
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      TAG: ${{ steps.set_tag.outputs.new_release_version }}
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      # [CHANGEMENT] Re-tag staging -> <version> / latest centralisé dans `docker-release`.
      # La promotion ne s'exécute que si semantic-release a publié une nouvelle version
      # (garde-fou porté par l'action via `release_published`).
      - name: Promote image to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

      # [CHANGEMENT] Ajout du garde-fou : ne publie l'OpenAPI que si une version a été créée
      # (auparavant exécuté avec une version vide quand aucun release n'était publié).
      - name: Publish OpenAPI
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.set_tag.outputs.new_release_version }}
          spec_file: ./openapi-spec.json
