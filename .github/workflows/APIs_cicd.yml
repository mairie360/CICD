name: APIs CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: false
        type: string
        description: "Image base name"
      cicd_version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download Dependencies
        run: cargo fetch

      - name: Security Audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # [CHANGEMENT] Utilisation de la commande cargo standard au lieu de l'action-rs/cargo
      - name: Run lint check
        run: cargo clippy -- -D warnings

  build:
    name: Build Project & Spec
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Project
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-assets
          path: |
            target/release/
            openapi-spec.json
          retention-days: 1 # [CHANGEMENT] Limitation de la rétention pour économiser l'espace

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] Dépend de `lint` et non de `build` : le job ne consomme pas l'artefact
    # de build et recompile de toute façon en mode instrumenté. Il tourne donc en parallèle
    # de `build`. Les tests unitaires ne sont exécutés qu'une seule fois, via `cargo cov`.
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # [CHANGEMENT] Installation via taiki-e/install-action (plus rapide que `cargo install`),
      # aligné sur back-lib-cicd.yml.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # [CHANGEMENT] Passe par l'alias cargo `cov` défini par le repo consommateur
      # (aligné sur la convention `cargo lint_check`). L'alias doit exécuter les tests,
      # appliquer le seuil de couverture et produire `codecov.json` pour l'upload ci-dessous.
      - name: Run Rust Tests & Check Coverage
        run: cargo cov

      # [NOUVEAU] Upload de la couverture vers Codecov (copié de back-lib-cicd.yml),
      # uniquement sur main ou sur une PR ciblant main.
      - name: Envoyer à Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  release-dev:
    if: github.ref == 'refs/heads/main'
    # [CHANGEMENT] `build` ajouté explicitement : `unit_test` ne dépend plus de `build`,
    # or ce job consomme l'artefact `api-assets`.
    needs: [unit_test, build]
    environment: Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # [NOUVEAU] Exposed so the test jobs below run against the exact `dev-<sha_tag>`
    # image built here (same shape as BFFs-cicd.yml).
    outputs:
      image: ${{ steps.release.outputs.primary_image }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Logique Docker (build unique + push dev-<sha> / dev-latest)
      # centralisée dans l'action composite partagée `docker-release`.
      - name: Build & Push image (Dev)
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev-${{ steps.release.outputs.sha_tag }}
          dist_tag: dev

  # [CHANGEMENT] The three test jobs below no longer rebuild the API from source: they pull
  # the `dev-<sha_tag>` image published by `release-dev` (the one that gets promoted to
  # staging and prod) and hand it to the compose stacks through `IMAGE_REF`. The consumer's
  # `*_test.sh` scripts only build a local image when `IMAGE_REF` is empty (local usage).
  integration_tests:
    if: github.ref == 'refs/heads/main'
    name: Integration tests
    runs-on: ubuntu-latest
    needs: release-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # [CHANGEMENT] Integration tests are owned by the consumer repo: `integration_test.sh`
      # (same shape as `security_test.sh`) starts `docker-compose-integration.yml`, waits for
      # the test-runner service and returns its exit code. No external service is involved.
      - name: Run integration tests via Docker Compose
        env:
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
        run: ./integration_test.sh

  integration_and_security:
    if: github.ref == 'refs/heads/main'
    name: Dynamic Security Tests (OWASP ZAP)
    needs: release-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # [NOUVEAU] MAIR-194: exposes the shared OpenAPI coverage gate
      # (`cicd-repo/tests/zap/zap_hooks.py`) to the consumer's compose stack, which
      # mounts it into the ZAP container and passes it with `--hook`.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run ZAP Security Scan via Docker Compose
        env:
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
        run: |
          # Starts the security stack; the job fails when ZAP reports a vulnerability
          # or when an operation of openapi.json was not reached (coverage gate).
          ./security_test.sh

  performance_isolated:
    if: github.ref == 'refs/heads/main'
    name: Isolated Performance Test
    runs-on: ubuntu-latest
    needs: release-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # [NOUVEAU] MAIR-194: exposes the shared OpenAPI coverage gate
      # (`cicd-repo/tests/k6/coverage.js`) to the consumer's compose stack, which mounts
      # it into the k6 container next to `openapi.json` and imports it from `load-test.js`.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] `TARGET_IMAGE` (recomputed locally, never read by any compose file) is
      # replaced by `IMAGE_REF`, taken from the `release-dev` outputs like the other test jobs.
      - name: Run Performance Tests via Docker Compose
        env:
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
        run: |
          # `--exit-code-from k6-perf-test` fails the job when k6 exceeds its thresholds,
          # including the `operations_uncovered` one of the coverage gate.
          ./performance_test.sh

  release-staging:
    needs: [integration_and_security, integration_tests, performance_isolated]
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Re-tag dev -> staging centralisé dans l'action composite `docker-release`.
      # Ajoute au passage le tag `staging-latest` (auparavant absent pour la stack API).
      - name: Promote image to Staging
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-staging.${{ steps.release.outputs.sha_tag }}
          dist_tag: staging

  release-prod:
    needs: release-staging
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      TAG: ${{ steps.set_tag.outputs.new_release_version }}
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      # [CHANGEMENT] Re-tag staging -> <version> / latest centralisé dans `docker-release`.
      # La promotion ne s'exécute que si semantic-release a publié une nouvelle version
      # (garde-fou porté par l'action via `release_published`).
      - name: Promote image to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

      # [CHANGEMENT] Ajout du garde-fou : ne publie l'OpenAPI que si une version a été créée
      # (auparavant exécuté avec une version vide quand aucun release n'était publié).
      - name: Publish OpenAPI
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: ./cicd-repo/actions/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.set_tag.outputs.new_release_version }}

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - lint
      - build
      - unit_test
      - release-dev
      - integration_tests
      - integration_and_security
      - performance_isolated
      - release-staging
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
