name: APIs CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: false
        type: string
        description: "Image base name"
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/rust p/secrets p/dockerfile p/github-actions cicd-repo/tests/semgrep/gdpr"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the pipeline on Semgrep findings (blocking SAST, MAIR-416)"
      image_scan_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the release on fixable HIGH/CRITICAL vulnerabilities found by Trivy in the image (accepted risks go in .trivyignore)"
      # [NOUVEAU] MAIR-291: GDPR contract check.
      gdpr_ai_model:
        required: false
        type: string
        default: "claude-sonnet-5-5"
        description: "Claude model that proposes field-to-column mappings in the GDPR contract check (MAIR-291); only used when the ANTHROPIC_API_KEY secret is set"
      gdpr_inventory_ref:
        required: false
        type: string
        default: "main"
        description: "Ref of mairie360/Database whose gdpr/inventory.yaml the GDPR contract check reads (MAIR-291)"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
        description: "Claude API key of the release journal and of the GDPR contract proposals (org secret); without it the journal keeps plain commit lists and the contract check runs without AI proposals"
      # [NOUVEAU] MAIR-291: only when the API key is not scoped to a workspace.
      ANTHROPIC_WORKSPACE_ID:
        required: false
      RELEASE_APP_ID:
        required: false
        description: "Release app (org secret) pushing the release journal on main"
      RELEASE_APP_PK:
        required: false
        description: "Private key of the release app (org secret)"
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Download Dependencies & Security Audit (cargo-audit)
        uses: ./cicd-repo/actions/dependencies/apis

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run lint check
        uses: ./cicd-repo/actions/lint/apis

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/security/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/security/gitleaks

  build:
    name: Build Project & Spec
    runs-on: ubuntu-latest
    needs: [lint, security_sast]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Build Project
        uses: ./cicd-repo/actions/build/apis

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] Dépend de `lint` et non de `build` : le job ne consomme pas l'artefact
    # de build et recompile de toute façon en mode instrumenté. Il tourne donc en parallèle
    # de `build`. Les tests unitaires ne sont exécutés qu'une seule fois, via `cargo cov`.
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run Rust Tests & Check Coverage
        uses: ./cicd-repo/actions/unit-tests/apis
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  release-dev:
    if: github.ref == 'refs/heads/main'
    # [CHANGEMENT] `build` ajouté explicitement : `unit_test` ne dépend plus de `build`,
    # or ce job consomme l'artefact `api-assets`.
    needs: [unit_test, build]
    # [CHANGEMENT] MAIR-416: no `environment: Dev`, so no approval gate: every commit on main
    # is released to dev right away. Staging and prod are promote-staging.yml / promote-prod.yml
    # (MAIR-494), manual runs that retag this image.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # [NOUVEAU] MAIR-416: cosign keyless signature
    # [NOUVEAU] Exposed so the test jobs below run against the exact `dev-<sha_tag>`
    # image built here (same shape as BFFs-cicd.yml), and so the promotions check that
    # they promote this very digest.
    outputs:
      image: ${{ steps.release.outputs.primary_image }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: api-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Single build + push dev-<sha>, SBOM/provenance, Trivy scan, cosign
      # signature, then the `dev` tag: all in the shared `docker-release` action (MAIR-416).
      - name: Build & Push image (Dev)
        id: release
        uses: ./cicd-repo/actions/release/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          scan_fail_on_findings: ${{ inputs.image_scan_fail_on_findings }}

      - name: Publish OpenAPI
        uses: ./cicd-repo/actions/release/publish-openapi-rust
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev-${{ steps.release.outputs.sha_tag }}
          dist_tag: dev

      # [NOUVEAU] RELEASE_JOURNAL.md rewritten on main after this release (release/release-journal).
      # A journal failure never fails the release.
      - name: Release journal
        continue-on-error: true
        uses: ./cicd-repo/actions/release/release-journal
        with:
          stage: dev
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          app_id: ${{ secrets.RELEASE_APP_ID }}
          app_private_key: ${{ secrets.RELEASE_APP_PK }}

  # [NOUVEAU] MAIR-291: the responses of the OpenAPI contract carry no credentials column of the
  # GDPR inventory (actions/security/gdpr-contract). A check job of every event: `release-dev` does
  # not need it, but promote-staging refuses a commit whose main run has a failed job (MAIR-494).
  gdpr_contract:
    name: GDPR contract (OpenAPI)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Same command as publish-openapi-rust: the spec the release publishes.
      - name: Generate the OpenAPI spec
        run: cargo open_api > "$RUNNER_TEMP/openapi.json"

      - name: Check the contract
        uses: ./cicd-repo/actions/security/gdpr-contract
        with:
          spec_file: ${{ runner.temp }}/openapi.json
          inventory_ref: ${{ inputs.gdpr_inventory_ref }}
          ai_model: ${{ inputs.gdpr_ai_model }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - security_sast
      - lint
      - build
      - unit_test
      - release-dev
      - gdpr_contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify/cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
