name: BFFs CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        description: "Nom de l'image Docker et du package"
      node_version:
        required: false
        type: string
        default: "20"
        description: "Version de Node.js"
      cicd_version:
        required: true
        type: string

jobs:
  dependencies:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # [CHANGEMENT] Utilisation du cache natif de setup-node (sur ~/.npm)
      # qui suffit amplement et évite de stocker un dossier node_modules lourd et instable.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mairie360'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

  build:
    name: Build & OpenAPI Spec
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      # [CHANGEMENT] Ajout de retention-days: 1 pour purger rapidement l'artefact temporaire
      - name: Upload Build & Spec
        uses: actions/upload-artifact@v7
        with:
          name: bff-assets
          path: |
            dist/
          retention-days: 1

  test:
    name: Test Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

  release-dev:
    name: Release Dev
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      # [CHANGEMENT] Configuration de Buildx et activation du cache GHA pour Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image (Source of Truth)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.package_name }}:dev-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.package_name }}:dev-latest
          secrets: |
            npmrc=<<EOF
            @mairie360:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
            EOF
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish OpenAPI (Dev)
        uses: ./cicd-repo/actions/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev.${{ github.sha }}
          spec_file: ./openapi-spec.json

  release-staging:
    name: Release Staging
    needs: release-dev
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: bff-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Promote Image to Staging
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          docker pull $REPO/${{ inputs.package_name }}:dev-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:dev-$SHA_TAG $REPO/${{ inputs.package_name }}:staging-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:dev-$SHA_TAG $REPO/${{ inputs.package_name }}:staging-latest
          docker push $REPO/${{ inputs.package_name }} --all-tags

      - name: Publish OpenAPI (Staging)
        uses: ./cicd-repo/actions/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-staging.${{ github.sha }}
          spec_file: ./openapi-spec.json

  release-prod:
    name: Release Prod
    needs: release-staging
    environment: Prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Spec
        uses: actions/download-artifact@v8
        with:
          name: bff-assets
          path: .

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Correction du chemin de l'action pour pointer vers le dépôt centralisé 'cicd-repo'
      # au lieu de ./.github/actions/semantic-tag qui n'existe pas dans ce contexte.
      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      - name: Log in to GHCR
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Promote Image to Prod
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TAG=${{ steps.set_tag.outputs.new_release_version }}
          docker pull $REPO/${{ inputs.package_name }}:staging-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:staging-$SHA_TAG $REPO/${{ inputs.package_name }}:$TAG
          docker tag $REPO/${{ inputs.package_name }}:staging-$SHA_TAG $REPO/${{ inputs.package_name }}:latest
          docker push $REPO/${{ inputs.package_name }} --all-tags

      - name: Publish OpenAPI (Prod)
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          TAG: ${{ steps.set_tag.outputs.TAG }}
        uses: ./cicd-repo/actions/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.set_tag.outputs.new_release_version }}
          spec_file: ./openapi-spec.json
