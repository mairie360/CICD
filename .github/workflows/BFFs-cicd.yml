name: BFFs CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        description: "Nom de l'image Docker et du package"
      node_version:
        required: false
        type: string
        default: "20"
        description: "Version de Node.js"
      cicd_version:
        required: true
        type: string
        description: "Ref (tag) du repo mairie360/CICD pour les actions composites"
      npm_scope:
        required: false
        type: string
        default: "@mairie360"
        description: "Scope npm hébergé sur GitHub Packages"
      openapi_spec_path:
        required: false
        type: string
        default: "openapi-spec.json"
        description: "Chemin de la spec OpenAPI après `npm run build` (relatif à la racine du repo)"
      artifact_retention_days:
        required: false
        type: number
        default: 30
        description: "Rétention des artefacts, doit couvrir le délai d'approbation Staging/Prod"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true
    outputs:
      release_published:
        description: "'true' si une nouvelle version a été publiée en prod"
        value: ${{ jobs.release-prod.outputs.published }}
      release_version:
        description: "Version sémantique publiée en prod"
        value: ${{ jobs.release-prod.outputs.version }}

defaults:
  run:
    shell: bash

jobs:
  # ==========================================================================
  # CI
  # ==========================================================================
  dependencies:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.npm_scope }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security_audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.npm_scope }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (Block on High/Critical)
        run: npm audit --audit-level=high

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.npm_scope }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

  security_sast:
    name: Code Security Audit (Semgrep)
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # returntocorp/semgrep-action est dépréciée : on utilise l'image officielle.
      # --error fait échouer le job si Semgrep remonte au moins un finding.
      - name: Run Semgrep Security Scan
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
              --config p/typescript \
              --config p/owasp-top-ten \
              --error

  build:
    name: Build & OpenAPI Spec
    runs-on: ubuntu-latest
    needs: [lint, security_audit, security_sast]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.npm_scope }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      # La spec est copiée sous un nom fixe pour que son emplacement dans
      # l'artefact ne dépende pas de l'arborescence du repo.
      - name: Vérifier et isoler la spec OpenAPI
        env:
          SPEC_PATH: ${{ inputs.openapi_spec_path }}
        run: |
          set -euo pipefail
          if [ ! -s "$SPEC_PATH" ]; then
            echo "::error::Spec OpenAPI introuvable ou vide : '$SPEC_PATH' (input openapi_spec_path)"
            exit 1
          fi
          if ! jq empty "$SPEC_PATH"; then
            echo "::error::'$SPEC_PATH' n'est pas un JSON valide"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/openapi"
          cp "$SPEC_PATH" "$RUNNER_TEMP/openapi/openapi-spec.json"

      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: bff-assets
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          overwrite: true

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi/openapi-spec.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          overwrite: true

  test:
    name: Test Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.npm_scope }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

      - name: Upload Coverage to Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  # ==========================================================================
  # DEV : l'image est construite UNE SEULE FOIS ici.
  # Staging et Prod ajoutent des tags sur la même image (dev -> staging -> prod), sans rebuild.
  # ==========================================================================
  release-dev:
    name: Release Dev
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: Dev
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.repository }}-release-dev
      cancel-in-progress: false
    outputs:
      image: ${{ steps.release.outputs.primary_image }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      # [CHANGEMENT] Checkout nécessaire avant le build pour pouvoir appeler
      # l'action composite locale : contrairement au commentaire précédent,
      # `cicd-repo/` finit donc dans le contexte de build (`COPY . .`), mais
      # seulement dans le stage builder intermédiaire (jamais copié dans
      # l'image runtime finale des Dockerfile multi-stage). Même compromis
      # que APIs_cicd.yml, qui appelle déjà `docker-release` de cette façon.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # Généré hors du contexte de build (RUNNER_TEMP) et monté comme secret
      # BuildKit : absent des couches, du cache et de l'attestation de provenance.
      - name: Générer le .npmrc de build
        env:
          NPM_SCOPE: ${{ inputs.npm_scope }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            "${NPM_SCOPE}:registry=https://npm.pkg.github.com" \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$RUNNER_TEMP/docker-build.npmrc"

      # [CHANGEMENT] Logique Docker (build unique + push dev-<sha> / dev)
      # centralisée dans l'action composite partagée `docker-release`, comme
      # dans APIs_cicd.yml / frontend-cicd.yml. Le mécanisme à deux secrets
      # (fichier .npmrc + variable NODE_AUTH_TOKEN, jamais combinés dans un
      # même artefact) est préservé via `build_secret_files`/`build_secret_envs`.
      - name: Build & Push Image (Dev)
        id: release
        uses: ./cicd-repo/actions/docker-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_secret_files: |
            npmrc=${{ runner.temp }}/docker-build.npmrc
          build_secret_envs: |
            node_auth_token=NODE_AUTH_TOKEN

      - name: Supprimer le .npmrc de build
        if: always()
        run: rm -f "$RUNNER_TEMP/docker-build.npmrc"

      - name: Download OpenAPI Spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: .

      - name: Publish OpenAPI (Dev)
        uses: ./cicd-repo/actions/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev.${{ github.sha }}
          dist_tag: dev
          spec_file: ./openapi-spec.json

  security_tests:
    name: Dynamic Security Tests (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: release-dev
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # docker-compose-security.yml monte ./.npmrc comme secret BuildKit pour
      # que le service bff-user puisse installer les packages @mairie360/* :
      # ce fichier n'existe pas après un simple checkout (il est gitignored).
      - name: Générer le .npmrc de build
        env:
          NPM_SCOPE: ${{ inputs.npm_scope }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            "${NPM_SCOPE}:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
            > .npmrc

      # IMAGE_REF pointe sur le tag dev-<sha_tag> exact buildé par ce run
      # (plus fiable que dev-latest si plusieurs pushs se suivent).
      - name: Run ZAP Security Scan via Docker Compose
        env:
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./security_test.sh

      - name: Supprimer le .npmrc de build
        if: always()
        run: rm -f .npmrc

  performance_tests:
    name: Isolated Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: release-dev
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # docker-compose-performance.yml monte ./.npmrc comme secret BuildKit pour
      # que le service bff-user puisse installer les packages @mairie360/* :
      # ce fichier n'existe pas après un simple checkout (il est gitignored).
      - name: Générer le .npmrc de build
        env:
          NPM_SCOPE: ${{ inputs.npm_scope }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            "${NPM_SCOPE}:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
            > .npmrc

      - name: Run Performance Tests via Docker Compose
        env:
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./performance_test.sh

      - name: Supprimer le .npmrc de build
        if: always()
        run: rm -f .npmrc

  # ==========================================================================
  # STAGING : tags staging-<sha_tag> et staging sur l'image de dev
  # ==========================================================================
  release-staging:
    name: Release Staging
    needs: [release-dev, security_tests, performance_tests]
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.repository }}-release-staging
      cancel-in-progress: false
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Re-tag dev -> staging centralisé dans l'action composite
      # `docker-release`, comme APIs_cicd.yml / frontend-cicd.yml.
      - name: Promote Image to Staging
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download OpenAPI Spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: .

      - name: Publish OpenAPI (Staging)
        uses: ./cicd-repo/actions/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-staging.${{ github.sha }}
          dist_tag: staging
          spec_file: ./openapi-spec.json

  # ==========================================================================
  # PROD : tags <version> et latest, uniquement si semantic-release publie
  # ==========================================================================
  release-prod:
    name: Release Prod
    needs: [release-dev, release-staging]
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.repository }}-release-prod
      cancel-in-progress: false
    outputs:
      published: ${{ steps.set_tag.outputs.new_release_published }}
      version: ${{ steps.set_tag.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      # [CHANGEMENT] Re-tag staging -> <version> / latest centralisé dans `docker-release`.
      - name: Promote Image to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

      # Téléchargée après semantic-release pour ne pas ajouter de fichier
      # non suivi dans l'arbre de travail pendant le calcul de version.
      - name: Download OpenAPI Spec
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: .

      - name: Publish OpenAPI (Prod)
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: ./cicd-repo/actions/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.set_tag.outputs.new_release_version }}
          spec_file: ./openapi-spec.json

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - security_audit
      - lint
      - security_sast
      - build
      - test
      - release-dev
      - security_tests
      - performance_tests
      - release-staging
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
