name: BFFs CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        description: "Nom de l'image Docker et du package"
      node_version:
        required: false
        type: string
        default: "24"
        description: "Version de Node.js"
      cicd_version:
        required: true
        type: string
        description: "Ref (tag) du repo mairie360/CICD pour les actions composites"
      npm_scope:
        required: false
        type: string
        default: "@mairie360"
        description: "Scope npm hébergé sur GitHub Packages"
      openapi_spec_path:
        required: false
        type: string
        default: "openapi-spec.json"
        description: "Chemin de la spec OpenAPI après `npm run build` (relatif à la racine du repo)"
      artifact_retention_days:
        required: false
        type: number
        default: 30
        description: "Rétention des artefacts, doit couvrir le délai d'approbation Staging/Prod"
      semgrep_config:
        required: false
        type: string
        default: "p/typescript p/owasp-top-ten p/nodejs p/expressjs p/secrets p/dockerfile p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the pipeline on Semgrep findings (blocking SAST)"
      image_scan_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the release on fixable HIGH/CRITICAL vulnerabilities found by Trivy in the image (accepted risks go in .trivyignore)"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true
    outputs:
      release_published:
        description: "'true' si une nouvelle version a été publiée en prod"
        value: ${{ jobs.release-prod.outputs.published }}
      release_version:
        description: "Version sémantique publiée en prod"
        value: ${{ jobs.release-prod.outputs.version }}

defaults:
  run:
    shell: bash

jobs:
  # ==========================================================================
  # CI
  # ==========================================================================
  dependencies:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Install dependencies
        uses: ./cicd-repo/actions/dependencies/bffs
        with:
          node_version: ${{ inputs.node_version }}
          npm_scope: ${{ inputs.npm_scope }}
          node_auth_token: ${{ secrets.GITHUB_TOKEN }}

  security_audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run npm audit (Block on High/Critical)
        uses: ./cicd-repo/actions/dependencies/bffs
        with:
          node_version: ${{ inputs.node_version }}
          npm_scope: ${{ inputs.npm_scope }}
          node_auth_token: ${{ secrets.GITHUB_TOKEN }}
          audit: 'true'

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Lint code
        uses: ./cicd-repo/actions/lint/bffs
        with:
          node_version: ${{ inputs.node_version }}
          npm_scope: ${{ inputs.npm_scope }}
          node_auth_token: ${{ secrets.GITHUB_TOKEN }}

  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] MAIR-230: shared `semgrep` composite action (pinned image) instead of the
      # inline `semgrep/semgrep:latest` run. Still blocking by default; the previous rulesets
      # (p/typescript, p/owasp-top-ten) are kept and extended (0 new findings on the BFFs' main).
      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/security/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/security/gitleaks

  build:
    name: Build & OpenAPI Spec
    runs-on: ubuntu-latest
    needs: [lint, security_audit, security_sast]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Build & OpenAPI Spec
        uses: ./cicd-repo/actions/build/bffs
        with:
          node_version: ${{ inputs.node_version }}
          npm_scope: ${{ inputs.npm_scope }}
          node_auth_token: ${{ secrets.GITHUB_TOKEN }}
          openapi_spec_path: ${{ inputs.openapi_spec_path }}
          artifact_retention_days: ${{ inputs.artifact_retention_days }}

  test:
    name: Test Check
    runs-on: ubuntu-latest
    # [CHANGEMENT] Runs in parallel with `build` (tests do not use its artifact).
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Test Check
        uses: ./cicd-repo/actions/unit-tests/bffs
        with:
          node_version: ${{ inputs.node_version }}
          npm_scope: ${{ inputs.npm_scope }}
          node_auth_token: ${{ secrets.GITHUB_TOKEN }}
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # DEV : l'image est construite UNE SEULE FOIS ici.
  # Staging et Prod ajoutent des tags sur la même image (dev -> staging -> prod), sans rebuild.
  # ==========================================================================
  release-dev:
    name: Release Dev
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-416: no `environment: Dev`, so no approval gate: every commit on main
    # is released to dev right away. Staging and Prod keep their environments.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # [NOUVEAU] MAIR-416: cosign keyless signature
    concurrency:
      group: ${{ github.repository }}-release-dev
      cancel-in-progress: false
    outputs:
      image: ${{ steps.release.outputs.primary_image }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # [CHANGEMENT] Checkout nécessaire avant le build pour pouvoir appeler
      # l'action composite locale : contrairement au commentaire précédent,
      # `cicd-repo/` finit donc dans le contexte de build (`COPY . .`), mais
      # seulement dans le stage builder intermédiaire (jamais copié dans
      # l'image runtime finale des Dockerfile multi-stage). Même compromis
      # que APIs_cicd.yml, qui appelle déjà `docker-release` de cette façon.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # Généré hors du contexte de build (RUNNER_TEMP) et monté comme secret
      # BuildKit : absent des couches, du cache et de l'attestation de provenance.
      - name: Générer le .npmrc de build
        env:
          NPM_SCOPE: ${{ inputs.npm_scope }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            "${NPM_SCOPE}:registry=https://npm.pkg.github.com" \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > "$RUNNER_TEMP/docker-build.npmrc"

      # [CHANGEMENT] Logique Docker (build unique + push dev-<sha> / dev)
      # centralisée dans l'action composite partagée `docker-release`, comme
      # dans APIs_cicd.yml / frontend-cicd.yml. Le mécanisme à deux secrets
      # (fichier .npmrc + variable NODE_AUTH_TOKEN, jamais combinés dans un
      # même artefact) est préservé via `build_secret_files`/`build_secret_envs`.
      - name: Build & Push Image (Dev)
        id: release
        uses: ./cicd-repo/actions/release/docker-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_secret_files: |
            npmrc=${{ runner.temp }}/docker-build.npmrc
          build_secret_envs: |
            node_auth_token=NODE_AUTH_TOKEN
          scan_fail_on_findings: ${{ inputs.image_scan_fail_on_findings }}

      - name: Supprimer le .npmrc de build
        if: always()
        run: rm -f "$RUNNER_TEMP/docker-build.npmrc"

      - name: Download OpenAPI Spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: .

      - name: Publish OpenAPI (Dev)
        uses: ./cicd-repo/actions/release/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-dev.${{ github.sha }}
          dist_tag: dev
          spec_file: ./openapi-spec.json

  security_tests:
    name: Dynamic Security Tests (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: release-dev
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-194: exposes the shared OpenAPI coverage gate
      # (`cicd-repo/tests/zap/zap_hooks.py`) to the consumer's compose stack, which
      # mounts it into the ZAP container and passes it with `--hook`.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run ZAP Security Scan via Docker Compose
        uses: ./cicd-repo/actions/security/bffs
        with:
          image_ref: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
          npm_scope: ${{ inputs.npm_scope }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  performance_tests:
    name: Isolated Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: release-dev
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-194: exposes the shared OpenAPI coverage gate
      # (`cicd-repo/tests/k6/coverage.js`) to the consumer's compose stack, which mounts
      # it into the k6 container next to `openapi.json` and imports it from `load-test.js`.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Performance Tests via Docker Compose
        uses: ./cicd-repo/actions/performance/bffs
        with:
          image_ref: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}
          npm_scope: ${{ inputs.npm_scope }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # STAGING : tags staging-<sha_tag> et staging sur l'image de dev
  # ==========================================================================
  release-staging:
    name: Release Staging
    needs: [release-dev, security_tests, performance_tests]
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.repository }}-release-staging
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] MAIR-416: promotes the digest of `dev-<sha>` (the tested image, checked
      # against release-dev's digest and signature), never the mobile `dev` tag.
      - name: Promote Image to Staging
        id: release
        uses: ./cicd-repo/actions/release/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          expected_digest: ${{ needs.release-dev.outputs.digest }}

      - name: Download OpenAPI Spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: .

      - name: Publish OpenAPI (Staging)
        uses: ./cicd-repo/actions/release/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.0.0-staging.${{ github.sha }}
          dist_tag: staging
          spec_file: ./openapi-spec.json

  # ==========================================================================
  # PROD : tags <version> et latest, uniquement si semantic-release publie
  # ==========================================================================
  release-prod:
    name: Release Prod
    needs: [release-dev, release-staging]
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.repository }}-release-prod
      cancel-in-progress: false
    outputs:
      published: ${{ steps.set_tag.outputs.new_release_published }}
      version: ${{ steps.set_tag.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/release/semantic-tag

      # [CHANGEMENT] MAIR-416: promotes the digest of `staging-<sha>` (checked against
      # release-staging's digest and signature) to <version> / latest.
      - name: Promote Image to Prod
        uses: ./cicd-repo/actions/release/docker-release
        with:
          stage: prod
          expected_digest: ${{ needs.release-staging.outputs.digest }}
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

      # Téléchargée après semantic-release pour ne pas ajouter de fichier
      # non suivi dans l'arbre de travail pendant le calcul de version.
      - name: Download OpenAPI Spec
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: .

      - name: Publish OpenAPI (Prod)
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: ./cicd-repo/actions/release/publish-openapi-typescript
        with:
          package_name: ${{ inputs.package_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.set_tag.outputs.new_release_version }}
          spec_file: ./openapi-spec.json

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - security_audit
      - lint
      - security_sast
      - build
      - test
      - release-dev
      - security_tests
      - performance_tests
      - release-staging
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify/cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
