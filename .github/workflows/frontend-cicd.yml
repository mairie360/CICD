name: Frontends CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "24"
      # [CHANGEMENT] Ajout de l'input cicd_version pour récupérer dynamiquement
      # l'action partagée de release, comme dans les autres workflows centralisés.
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/typescript p/react p/owasp-top-ten p/secrets p/dockerfile p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the pipeline on Semgrep findings (blocking SAST, MAIR-416)"
      image_scan_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the release on fixable HIGH/CRITICAL vulnerabilities found by Trivy in the image (accepted risks go in .trivyignore)"
      rgaa_min_rate:
        required: false
        type: number
        default: 60
        description: "Minimum RGAA rate (percent) of the automatically decided criteria, checked between staging and prod; below it release-prod stops before tagging (MAIR-319)"
      rgaa_ai_model:
        required: false
        type: string
        default: "claude-sonnet-5-5"
        description: "Claude model of the RGAA AI pre-audit (MAIR-320); the pre-audit only runs when the ANTHROPIC_API_KEY secret is set"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true
      # [NOUVEAU] MAIR-320: optional; without it the RGAA AI pre-audit is skipped.
      ANTHROPIC_API_KEY:
        required: false

jobs:
  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [CHANGEMENT] Utilisation native du cache npm de setup-node (sur ~/.npm)
      # plus léger et performant que la sauvegarde complète du dossier node_modules.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mairie360'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

  security_audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mairie360'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (Block on High/Critical)
        run: npm audit --audit-level=high

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/gitleaks

  build:
    name: Build Check (Next.js)
    runs-on: ubuntu-latest
    needs: [lint, security_audit, security_sast]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] Runs in parallel with `build` (tests do not use its output).
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # [CHANGEMENT] MAIR-416: no more `--if-present`, a front without a test script fails CI.
      - run: npm test

      - name: Upload Coverage to Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  release-dev:
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-416: no `environment: Dev`, so no approval gate: every commit on main
    # is released to dev right away. Staging and Prod keep their environments.
    permissions:
      contents: read
      packages: write
      id-token: write  # [NOUVEAU] MAIR-416: cosign keyless signature
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      # [NOUVEAU] MAIR-317: the test jobs run the published `dev-<sha_tag>` image (IMAGE_REF)
      # instead of rebuilding the front, like APIs_cicd.yml / BFFs-cicd.yml.
      image: ${{ steps.release.outputs.primary_image }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] MAIR-416: the npm token is a BuildKit secret (env `NODE_AUTH_TOKEN` inside
      # `RUN --mount=type=secret,id=node_auth_token,env=NODE_AUTH_TOKEN`), no longer a build arg
      # that ended up in the image history, the build cache and the provenance attestation.
      # Single build, SBOM/provenance, Trivy scan and cosign signature in `docker-release`.
      - name: Build & Push Image (Dev)
        id: release
        uses: ./cicd-repo/actions/docker-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_secret_envs: |
            node_auth_token=NODE_AUTH_TOKEN
          scan_fail_on_findings: ${{ inputs.image_scan_fail_on_findings }}

  security_tests:
    name: Dynamic Security Tests (OWASP ZAP)
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-468: bounded like the BFF test jobs; without it a hung stack held a
    # runner for GitHub's 6 h default and starved the whole org's queue.
    timeout-minutes: 25
    needs: release-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Run ZAP Security Scan via Docker Compose
        timeout-minutes: 15
        run: ./security_test.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # [NOUVEAU] MAIR-317: the stack's front service reads `${IMAGE_REF}` (no `build:`).
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}

      # [NOUVEAU] MAIR-468: when the stack hangs (e.g. an API that never answers on `/health`,
      # leaving a `*-ready` service polling forever), the step timeout kills the script before
      # its `docker compose down`, so the containers are still there: print their state and
      # logs to see why the service under test did not start.
      - name: Dump container logs
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect --format '{{.Name}} ({{.State.Status}}, exit {{.State.ExitCode}})' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

  performance_tests:
    name: Isolated Performance Tests (k6)
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-468: bounded like the BFF test jobs; without it a hung stack held a
    # runner for GitHub's 6 h default and starved the whole org's queue.
    timeout-minutes: 25
    needs: release-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Run Performance Tests via Docker Compose
        timeout-minutes: 15
        run: ./performance_test.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # [NOUVEAU] MAIR-317: the stack's front service reads `${IMAGE_REF}` (no `build:`).
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:dev-${{ needs.release-dev.outputs.sha_tag }}

      # [NOUVEAU] MAIR-468: when the stack hangs (e.g. an API that never answers on `/health`,
      # leaving a `*-ready` service polling forever), the step timeout kills the script before
      # its `docker compose down`, so the containers are still there: print their state and
      # logs to see why the service under test did not start.
      - name: Dump container logs
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect --format '{{.Name}} ({{.State.Status}}, exit {{.State.ExitCode}})' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

  release-staging:
    needs: [release-dev, security_tests, performance_tests]
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] MAIR-416: promotes the digest of `dev-<sha>` (the tested image, checked
      # against release-dev's digest and signature), never the mobile `dev` tag.
      - name: Promote Image to Staging
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          expected_digest: ${{ needs.release-dev.outputs.digest }}

  release-prod:
    # [CHANGEMENT] MAIR-317: needs release-dev too, for the image name and sha tag of the RGAA run.
    needs: [release-dev, release-staging]
    runs-on: ubuntu-latest
    environment: Prod
    # [NOUVEAU] MAIR-317: bounded like the test jobs (MAIR-468), the RGAA stack runs in this job.
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    outputs:
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # [CHANGEMENT] Récupération du dépôt centralisé des outils CI/CD
      # pour pouvoir utiliser l'action composite 'semantic-tag'.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [NOUVEAU] MAIR-317 (epic MAIR-297): RGAA gate between staging and prod. It runs once the
      # Prod approval is given and before anything is tagged or promoted: the front's
      # `accessibility_test.sh` starts its `docker-compose-accessibility.yml` stack on the
      # `staging-<sha>` image, the runner plays the states of `rgaa.yaml` with the engine of
      # `cicd-repo/tests/a11y` and writes `rgaa-report/` (artifact + job summary, input of the n8n
      # release chain, MAIR-298). A failure stops the job: no tag, no prod image.
      - name: Check the accessibility scope
        run: |
          missing=0
          for f in rgaa.yaml accessibility_test.sh docker-compose-accessibility.yml; do
            if [ ! -f "$f" ]; then
              echo "::error title=RGAA::$f is missing: every front declares its RGAA scope and stack (see the mairie360/CICD README, \"RGAA scope\")"
              missing=1
            fi
          done
          exit "$missing"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # [NOUVEAU] MAIR-320: AI verdicts by element fingerprint, kept between runs so that only new or
      # changed elements are sent to Claude (until the n8n store, MAIR-275, holds them).
      - name: Restore RGAA AI verdicts
        uses: actions/cache/restore@v6
        with:
          path: .rgaa-ai-cache
          key: rgaa-ai-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rgaa-ai-${{ github.repository }}-

      - name: Run accessibility tests via Docker Compose
        timeout-minutes: 15
        run: ./accessibility_test.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.release-dev.outputs.image }}:staging-${{ needs.release-dev.outputs.sha_tag }}
          # [NOUVEAU] MAIR-319: the runner service forwards it to the engine (exit 3 below it).
          RGAA_MIN_RATE: ${{ inputs.rgaa_min_rate }}
          # [NOUVEAU] MAIR-320: forwarded to the runner service with the .rgaa-ai-cache mount.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RGAA_AI_MODEL: ${{ inputs.rgaa_ai_model }}

      - name: Save RGAA AI verdicts
        if: always() && hashFiles('.rgaa-ai-cache/verdicts.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .rgaa-ai-cache
          key: rgaa-ai-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: RGAA job summary
        if: always()
        run: |
          if [ -f rgaa-report/summary.md ]; then
            cat rgaa-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RGAA report (the stack or the runner did not start, see the logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload RGAA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rgaa-report
          path: rgaa-report/
          if-no-files-found: ignore

      - name: Dump container logs
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect --format '{{.Name}} ({{.State.Status}}, exit {{.State.ExitCode}})' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      # [CHANGEMENT] Correction du chemin d'appel vers le dépôt centralisé 'cicd-repo'.
      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      # [CHANGEMENT] MAIR-416: promotes the digest of `staging-<sha>` (checked against
      # release-staging's digest and signature) to <version> / latest.
      - name: Promote Image to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          expected_digest: ${{ needs.release-staging.outputs.digest }}
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - lint
      - security_audit
      - security_sast
      - build
      - test
      - release-dev
      - security_tests
      - performance_tests
      - release-staging
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
