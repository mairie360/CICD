name: Frontends CICD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "23"
      # [CHANGEMENT] Ajout de l'input cicd_version pour récupérer dynamiquement
      # l'action partagée de release, comme dans les autres workflows centralisés.
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/typescript p/react p/owasp-top-ten p/secrets p/dockerfile p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: false
        description: "Fail the pipeline on Semgrep findings (report-only by default until the existing findings are triaged, see README)"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true

jobs:
  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [CHANGEMENT] Utilisation native du cache npm de setup-node (sur ~/.npm)
      # plus léger et performant que la sauvegarde complète du dossier node_modules.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mairie360'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

  security_audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mairie360'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (Block on High/Critical)
        run: npm audit --audit-level=high

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

  build:
    name: Build Check (Next.js)
    runs-on: ubuntu-latest
    needs: [lint, security_audit, security_sast]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test --if-present

      - name: Upload Coverage to Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  release-dev:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Logique Docker (build unique + push dev-<sha> / dev)
      # centralisée dans l'action composite partagée `docker-release`, comme
      # dans APIs_cicd.yml : élimine l'incohérence de longueur de SHA entre
      # ce job et les promotions staging/prod.
      - name: Build & Push Image (Dev)
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  security_tests:
    name: Dynamic Security Tests (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: release-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ZAP Security Scan via Docker Compose
        run: ./security_test.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance_tests:
    name: Isolated Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: release-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Performance Tests via Docker Compose
        run: ./performance_test.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-staging:
    needs: [security_tests, performance_tests]
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Re-tag dev -> staging centralisé dans l'action composite `docker-release`.
      - name: Promote Image to Staging
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release-prod:
    needs: release-staging
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # [CHANGEMENT] Récupération du dépôt centralisé des outils CI/CD
      # pour pouvoir utiliser l'action composite 'semantic-tag'.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Correction du chemin d'appel vers le dépôt centralisé 'cicd-repo'.
      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      # [CHANGEMENT] Re-tag staging -> <version> / latest centralisé dans `docker-release`.
      - name: Promote Image to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - lint
      - security_audit
      - security_sast
      - build
      - test
      - release-dev
      - security_tests
      - performance_tests
      - release-staging
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
