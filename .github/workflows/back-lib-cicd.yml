name: Back lib CICD

on:
  workflow_call:
    inputs:
      cicd_version:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: true

jobs:
  dependencies:
    name: Setup & Fetch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download Dependencies
        run: cargo fetch

      - name: Pre-compile dependencies
        run: cargo check --release

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run lint_check
        uses: actions-rs/cargo@v1
        with:
          command: lint_check

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: target/release/
          retention-days: 1

  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Tests
        run: cargo test --release

      - name: Générer le rapport de couverture
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: cargo llvm-cov --workspace --codecov --output-path codecov.json
      
      - name: Envoyer à Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  publish_release:
    if: github.ref == 'refs/heads/main'
    environment: Release
    needs: unit_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PK }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Cleanup CICD Tools checkout
        # On n'a plus besoin de cicd-repo une fois le tag calculé : on l'enlève
        # pour que cargo ne le voie pas comme des fichiers non commités.
        run: rm -rf cicd-repo

      - name: Setup Rust & Cargo Release
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
        run: |
          # Met à jour la version dans Cargo.toml avec celle du nouveau tag
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" Cargo.toml
          # Autorise la publication malgré le Cargo.toml/Cargo.lock modifiés
          # (bump de version non commité, c'est le seul changement attendu ici)
          cargo publish --allow-dirty

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
        run: |
          # Reporte sur main la version publiée, pour que Cargo.toml/Cargo.lock
          # reflètent toujours ce qui a été publié sur crates.io.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
          fi
