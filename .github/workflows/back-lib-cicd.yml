name: Back lib CICD

on:
  workflow_call:
    inputs:
      cicd_version:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: true
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PK:
        required: true

jobs:
  dependencies:
    name: Setup & Fetch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download Dependencies
        run: cargo fetch

      - name: Pre-compile dependencies
        run: cargo check --release

  # [NOUVEAU] Job dédié aux audits de sécurité de la bibliothèque
  security_audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Audit (Vulnerability Check)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Run Cargo Deny (License & Advisory Check)
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories licenses

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run lint check
        run: cargo lint_check

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, security_audit] # Bloqué si l'audit de sécurité échoue
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: target/release/
          retention-days: 1

  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Tests
        run: cargo test --release

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Générer le rapport de couverture
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: cargo llvm-cov --workspace --codecov --output-path codecov.json

      - name: Envoyer à Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  publish_release:
    if: github.ref == 'refs/heads/main'
    environment: Release
    needs: unit_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PK }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Setup Rust & Cargo Release
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
        run: |
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" Cargo.toml
          cargo publish --allow-dirty

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
          fi
