name: Back lib CICD

on:
  workflow_call:
    inputs:
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/rust p/secrets p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: false
        description: "Fail the pipeline on Semgrep findings (report-only by default until the existing findings are triaged, see README)"
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: true
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PK:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true

jobs:
  dependencies:
    name: Setup & Fetch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Download & Pre-compile Dependencies
        uses: ./cicd-repo/actions/dependencies/back-lib

  # [NOUVEAU] Job dédié aux audits de sécurité de la bibliothèque
  security_audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run Cargo Audit & Cargo Deny
        uses: ./cicd-repo/actions/security/back-lib

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run lint check
        uses: ./cicd-repo/actions/lint/back-lib

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/security/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/security/gitleaks

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, security_audit, security_sast] # Bloqué si l'audit de sécurité échoue
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Build
        uses: ./cicd-repo/actions/build/back-lib

  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] Runs in parallel with `build` (tests do not use its artifact).
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run Rust Tests & Generate Coverage
        uses: ./cicd-repo/actions/unit-tests/back-lib
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  publish_release:
    if: github.ref == 'refs/heads/main'
    environment: Release
    needs: [build, unit_test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PK }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/release/semantic-tag
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Setup Rust & Cargo Release
        if: steps.set_tag.outputs.new_release_published == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Cargo
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
        run: |
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" Cargo.toml
          cargo publish --allow-dirty

      - name: Commit version bump
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        # `main` only accepts changes through a pull request, so the bump goes
        # through a short-lived branch that is squash-merged right away. The
        # `[skip ci]` subject keeps the merge from starting another release.
        run: |
          BRANCH="chore/release-bump-$NEW_VERSION"
          SUBJECT="chore(release): bump version to $NEW_VERSION [skip ci]"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git switch -c "$BRANCH"
            git commit -m "$SUBJECT"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "chore(release): bump version to $NEW_VERSION" \
              --body "Automatic version bump after publishing $NEW_VERSION to crates.io.")
            gh pr merge "$PR_URL" --squash --delete-branch --subject "$SUBJECT" --body ""
          fi

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - security_audit
      - security_sast
      - lint
      - build
      - unit_test
      - publish_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify/cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
