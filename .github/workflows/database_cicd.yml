name: Database CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/secrets p/dockerfile p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the pipeline on Semgrep findings (blocking SAST, MAIR-416)"
      image_scan_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the release on fixable HIGH/CRITICAL vulnerabilities found by Trivy in the images (accepted risks go in .trivyignore)"
    secrets:
      N8N_WEBHOOK_SECRET:
        required: true
      CODECOV_TOKEN:
        required: true

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: ./test.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.lcov
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/gitleaks

  # [CHANGEMENT] MAIR-416: the three release jobs go through the shared `docker-release` action
  # like the other stacks (the `database` image plus `liquibase-migrations` as secondary image):
  # SBOM/provenance, Trivy scan and cosign signature at dev, promotion by digest of the same
  # commit afterwards. The mobile tags become `dev` / `staging` (formerly `dev-latest` /
  # `staging-latest`); the `dev-<sha>` / `staging-<sha>` / `<version>` / `latest` tags are kept.
  release-dev:
    name: Release to Dev
    needs: [tests, security_sast]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-416: no `environment: Dev`, so no approval gate: every commit on main
    # is released to dev right away. Staging and Prod keep their environments.
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signature
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      extra_digest: ${{ steps.release.outputs.extra_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Inside the build context, but neither Dockerfile copies the whole context.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Build & Push Images (Dev)
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          extra_dockerfile: ./liquibase/Dockerfile
          scan_fail_on_findings: ${{ inputs.image_scan_fail_on_findings }}

  release-staging:
    name: Release to Staging
    needs: release-dev
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      extra_digest: ${{ steps.release.outputs.extra_digest }}
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Promote Images to Staging
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          expected_digest: ${{ needs.release-dev.outputs.digest }}
          expected_extra_digest: ${{ needs.release-dev.outputs.extra_digest }}

  release-prod:
    name: Release to Prod
    needs: release-staging
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Images to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          expected_digest: ${{ needs.release-staging.outputs.digest }}
          expected_extra_digest: ${{ needs.release-staging.outputs.extra_digest }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - tests
      - security_sast
      - release-dev
      - release-staging
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
