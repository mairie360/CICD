name: Database CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/secrets p/dockerfile p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the pipeline on Semgrep findings (blocking SAST, MAIR-416)"
      image_scan_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the release on fixable HIGH/CRITICAL vulnerabilities found by Trivy in the images (accepted risks go in .trivyignore)"
      gdpr_ai_model:
        required: false
        type: string
        default: "claude-sonnet-5-5"
        description: "Claude model that proposes a classification for the columns missing from the GDPR inventory (MAIR-285); only used when the ANTHROPIC_API_KEY secret is set"
    secrets:
      N8N_WEBHOOK_SECRET:
        required: true
      CODECOV_TOKEN:
        required: true
      # [NOUVEAU] MAIR-285: optional; without it the GDPR inventory gate runs without AI proposals.
      ANTHROPIC_API_KEY:
        required: false
      # [NOUVEAU] MAIR-285: only when the API key is not scoped to a workspace.
      ANTHROPIC_WORKSPACE_ID:
        required: false

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-468: bounded like the BFF test jobs; without it a hung stack held a
    # runner for GitHub's 6 h default and starved the whole org's queue.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        timeout-minutes: 15
        run: ./test.sh

      # [NOUVEAU] MAIR-468: when the stack hangs (e.g. an API that never answers on `/health`,
      # leaving a `*-ready` service polling forever), the step timeout kills the script before
      # its `docker compose down`, so the containers are still there: print their state and
      # logs to see why the service under test did not start.
      - name: Dump container logs
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect --format '{{.Name}} ({{.State.Status}}, exit {{.State.ExitCode}})' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.lcov
          # [CHANGEMENT] MAIR-467: Codecov only reports coverage, so an outage on its side (expired
          # certificate on 2026-10-05) must not fail the job and block the release.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/gitleaks

  # [CHANGEMENT] MAIR-416: the three release jobs go through the shared `docker-release` action
  # like the other stacks (the `database` image plus `liquibase-migrations` as secondary image):
  # SBOM/provenance, Trivy scan and cosign signature at dev, promotion by digest of the same
  # commit afterwards. The mobile tags become `dev` / `staging` (formerly `dev-latest` /
  # `staging-latest`); the `dev-<sha>` / `staging-<sha>` / `<version>` / `latest` tags are kept.
  release-dev:
    name: Release to Dev
    needs: [tests, security_sast]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-416: no `environment: Dev`, so no approval gate: every commit on main
    # is released to dev right away. Staging and Prod keep their environments.
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signature
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      extra_digest: ${{ steps.release.outputs.extra_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Inside the build context, but neither Dockerfile copies the whole context.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Build & Push Images (Dev)
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          extra_dockerfile: ./liquibase/Dockerfile
          scan_fail_on_findings: ${{ inputs.image_scan_fail_on_findings }}

  # [NOUVEAU] MAIR-476: schema load test, gate between dev and staging, like the
  # `performance_tests` job of the other stacks. The repo's `./performance_test.sh`
  # migrates an empty database, loads a volume seed and runs pgbench scripts that replay
  # the APIs' hot queries; a script over its threshold (`bench/thresholds.conf`) fails the
  # job and blocks `release-staging`. Dev is still released on every commit (`release-dev`
  # does not need it). It builds from the commit's sources and never uses the dev image, so
  # it runs on PRs too, in parallel with the other jobs: a regression shows before merge.
  performance_tests:
    name: Performance Tests (schema bench)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run schema bench
        timeout-minutes: 20
        run: |
          if [ ! -x ./performance_test.sh ]; then
            echo "::warning::No executable ./performance_test.sh in this repo, schema bench skipped."
            exit 0
          fi
          ./performance_test.sh

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schema-bench-results
          path: bench/results/
          if-no-files-found: ignore

  release-staging:
    name: Release to Staging
    needs: [release-dev, performance_tests]
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      extra_digest: ${{ steps.release.outputs.extra_digest }}
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Promote Images to Staging
        id: release
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: staging
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          expected_digest: ${{ needs.release-dev.outputs.digest }}
          expected_extra_digest: ${{ needs.release-dev.outputs.extra_digest }}

  # [NOUVEAU] MAIR-285: GDPR inventory gate, between staging and the Prod approval. Migrates an
  # empty database with the images just promoted to staging (by digest) and checks that the repo's
  # `gdpr/inventory.yaml` classifies every column. It runs before `release-prod` waits for its
  # approval, so the approver reads the job summary first: the gaps, the inventory changes since
  # the last release and, for each unclassified column, a classification proposed by Claude
  # (never part of the verdict). A gap skips `release-prod`.
  gdpr_inventory:
    name: GDPR inventory (staging schema)
    needs: release-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous release tag, for the diff of the inventory

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Check the GDPR inventory
        uses: ./cicd-repo/actions/gdpr-inventory
        with:
          package_name: ${{ inputs.package_name }}
          digest: ${{ needs.release-staging.outputs.digest }}
          migrations_digest: ${{ needs.release-staging.outputs.extra_digest }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_model: ${{ inputs.gdpr_ai_model }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}

  release-prod:
    name: Release to Prod
    # [CHANGEMENT] MAIR-285: also waits for the GDPR inventory gate.
    needs: [release-staging, gdpr_inventory]
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Images to Prod
        uses: ./cicd-repo/actions/docker-release
        with:
          stage: prod
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          expected_digest: ${{ needs.release-staging.outputs.digest }}
          expected_extra_digest: ${{ needs.release-staging.outputs.extra_digest }}
          release_published: ${{ steps.set_tag.outputs.new_release_published }}
          release_version: ${{ steps.set_tag.outputs.new_release_version }}

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - tests
      - security_sast
      - release-dev
      - performance_tests
      - release-staging
      - gdpr_inventory
      - release-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
