name: Database CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      cicd_version:
        required: true
        type: string
      semgrep_config:
        required: false
        type: string
        default: "p/secrets p/dockerfile p/github-actions cicd-repo/tests/semgrep/gdpr"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the pipeline on Semgrep findings (blocking SAST, MAIR-416)"
      image_scan_fail_on_findings:
        required: false
        type: boolean
        default: true
        description: "Fail the release on fixable HIGH/CRITICAL vulnerabilities found by Trivy in the images (accepted risks go in .trivyignore)"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
        description: "Claude API key of the release journal (org secret); without it the journal keeps plain commit lists"
      RELEASE_APP_ID:
        required: false
        description: "Release app (org secret) pushing the release journal on main"
      RELEASE_APP_PK:
        required: false
        description: "Private key of the release app (org secret)"
      N8N_WEBHOOK_SECRET:
        required: true
      CODECOV_TOKEN:
        required: true

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-468: bounded like the BFF test jobs; without it a hung stack held a
    # runner for GitHub's 6 h default and starved the whole org's queue.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run tests
        timeout-minutes: 15
        uses: ./cicd-repo/actions/unit-tests/db

      # [NOUVEAU] MAIR-468: dumps the containers left behind when the step timeout kills the stack.
      - name: Dump container logs
        if: failure()
        uses: ./cicd-repo/actions/integration/container-logs

      # Outside the action so that the 15 min timeout above only covers `./test.sh`, as before.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.lcov
          # [CHANGEMENT] MAIR-467: Codecov only reports coverage, so an outage on its side (expired
          # certificate on 2026-10-05) must not fail the job and block the release.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/security/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/security/gitleaks

  # [CHANGEMENT] MAIR-416: the three release jobs go through the shared `docker-release` action
  # like the other stacks (the `database` image plus `liquibase-migrations` as secondary image):
  # SBOM/provenance, Trivy scan and cosign signature at dev, promotion by digest of the same
  # commit afterwards. The mobile tags become `dev` / `staging` (formerly `dev-latest` /
  # `staging-latest`); the `dev-<sha>` / `staging-<sha>` / `<version>` / `latest` tags are kept.
  release-dev:
    name: Release to Dev
    needs: [tests, security_sast]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # [CHANGEMENT] MAIR-416: no `environment: Dev`, so no approval gate: every commit on main
    # is released to dev right away. Staging and prod are promote-staging.yml / promote-prod.yml
    # (MAIR-494), manual runs that retag this image.
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signature
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      extra_digest: ${{ steps.release.outputs.extra_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Inside the build context, but neither Dockerfile copies the whole context.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Build & Push Images (Dev)
        id: release
        uses: ./cicd-repo/actions/release/docker-release
        with:
          stage: dev
          package_name: ${{ inputs.package_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_package_name: liquibase-migrations
          extra_dockerfile: ./liquibase/Dockerfile
          scan_fail_on_findings: ${{ inputs.image_scan_fail_on_findings }}

      # [NOUVEAU] RELEASE_JOURNAL.md rewritten on main after this release (release/release-journal).
      # A journal failure never fails the release.
      - name: Release journal
        continue-on-error: true
        uses: ./cicd-repo/actions/release/release-journal
        with:
          stage: dev
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          app_id: ${{ secrets.RELEASE_APP_ID }}
          app_private_key: ${{ secrets.RELEASE_APP_PK }}

  # [NOUVEAU] MAIR-476: schema load test, gate between dev and staging, like the
  # `performance_tests` job of the other stacks. The repo's `./performance_test.sh`
  # migrates an empty database, loads a volume seed and runs pgbench scripts that replay
  # the APIs' hot queries; a script over its threshold (`bench/thresholds.conf`) fails the
  # job, and promote-staging.yml refuses a commit whose main run has a failed job (MAIR-494).
  # Dev is still released on every commit (`release-dev` does not need it). It builds from the commit's sources and never uses the dev image, so
  # it runs on PRs too, in parallel with the other jobs: a regression shows before merge.
  performance_tests:
    name: Performance Tests (schema bench)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run schema bench
        timeout-minutes: 20
        uses: ./cicd-repo/actions/performance/db

      # Outside the action so that it still runs when the 20 min timeout above kills the bench.
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schema-bench-results
          path: bench/results/
          if-no-files-found: ignore

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - tests
      - security_sast
      - release-dev
      - performance_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify/cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
