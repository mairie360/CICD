name: Database CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      cicd_version:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: ./test.sh

  release-dev:
    name: Release to Dev
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Tags
        id: meta
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "db_repo=$REPO/${{ inputs.package_name }}" >> $GITHUB_OUTPUT
          echo "liq_repo=$REPO/liquibase-migrations" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      # [CHANGEMENT] Ajout du cache GHA pour l'image de la DB afin de réutiliser les couches construites.
      - name: Build & Push DB Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.db_repo }}:dev-${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.db_repo }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # [CHANGEMENT] Ajout du cache GHA pour l'image Liquibase.
      - name: Build & Push Liquibase Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./liquibase/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.liq_repo }}:dev-${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.liq_repo }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-staging:
    needs: release-dev
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Promote Images to Staging
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          # Promotion de l'image DB
          docker pull $REPO/${{ inputs.package_name }}:dev-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:dev-$SHA_TAG $REPO/${{ inputs.package_name }}:staging-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:dev-$SHA_TAG $REPO/${{ inputs.package_name }}:staging-latest
          docker push $REPO/${{ inputs.package_name }} --all-tags

          # Promotion de l'image Liquibase
          docker pull $REPO/liquibase-migrations:dev-$SHA_TAG
          docker tag $REPO/liquibase-migrations:dev-$SHA_TAG $REPO/liquibase-migrations:staging-$SHA_TAG
          docker tag $REPO/liquibase-migrations:dev-$SHA_TAG $REPO/liquibase-migrations:staging-latest
          docker push $REPO/liquibase-migrations --all-tags

  release-prod:
    needs: release-staging
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      packages: write
    outputs:
      PUBLISHED: ${{ steps.set_tag.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [CHANGEMENT] Correction de la syntaxe de l'action : nettoyage des doublons 'env' / 'with'
      # et suppression du paramètre 'cicd_path' obsolète pour cette action composite.
      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Promote Images to Prod
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TAG=${{ steps.set_tag.outputs.new_release_version }}

          # Pull et Tag final pour la DB
          docker pull $REPO/${{ inputs.package_name }}:staging-$SHA_TAG
          docker tag $REPO/${{ inputs.package_name }}:staging-$SHA_TAG $REPO/${{ inputs.package_name }}:$TAG
          docker tag $REPO/${{ inputs.package_name }}:staging-$SHA_TAG $REPO/${{ inputs.package_name }}:latest
          docker push $REPO/${{ inputs.package_name }} --all-tags

          # Pull et Tag final pour Liquibase
          docker pull $REPO/liquibase-migrations:staging-$SHA_TAG
          docker tag $REPO/liquibase-migrations:staging-$SHA_TAG $REPO/liquibase-migrations:$TAG
          docker tag $REPO/liquibase-migrations:staging-$SHA_TAG $REPO/liquibase-migrations:latest
          docker push $REPO/liquibase-migrations --all-tags
