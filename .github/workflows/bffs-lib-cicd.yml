name: BFFs lib CICD

on:
  workflow_call:
    inputs:
      cicd_version:
        required: true
        type: string
        description: "Ref (tag) of the mairie360/CICD repo for the composite actions"
      semgrep_config:
        required: false
        type: string
        default: "p/typescript p/nodejs p/expressjs p/secrets p/github-actions"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: false
        description: "Fail the pipeline on Semgrep findings (report-only by default until the existing findings are triaged, see README)"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Install & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Install & Security Audit
        uses: ./cicd-repo/actions/dependencies/bffs-lib

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run linter
        uses: ./cicd-repo/actions/lint/bffs-lib

  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/security/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/security/gitleaks

  build:
    name: Build library
    runs-on: ubuntu-latest
    needs: [lint, security_sast]
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Build package
        uses: ./cicd-repo/actions/build/bffs-lib

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run tests
        uses: ./cicd-repo/actions/unit-tests/bffs-lib
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: Package Publish
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/release/semantic-tag

      - uses: actions/setup-node@v7
        if: steps.set_tag.outputs.new_release_published == 'true'
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@mairie360'
          cache: npm

      - name: Install dependencies
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: npm ci

      - name: Set package version
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          NEW_VERSION: ${{ steps.set_tag.outputs.new_release_version }}
        run: npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      # The version is only set in the workspace: the git tag is the source of
      # truth, `package.json` stays at 0.0.0 in the repo (same as front-libs).
      - name: Build package
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: npm run build

      - name: Publish to GitHub Packages
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - lint
      - security_sast
      - build
      - test
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify/cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
