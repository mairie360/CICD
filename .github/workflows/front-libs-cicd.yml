name: Reusable CI/CD Pipeline

on:
  workflow_call:
    inputs:
      cicd_version:
        required: true
        type: string
        description: "Ref (tag) du repo mairie360/CICD pour les actions composites"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Install & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependencies vulnerabilities (npm audit)
        run: npm audit --audit-level=high

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  build:
    name: Build library
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: library-dist
          path: dist/
          retention-days: 1
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Upload Coverage to Codecov
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  security:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run npm audit (Vulnerability Check)
        run: npm audit --audit-level=high

      - name: Check TypeScript types
        # S'assure que le projet compile ses types sans erreur (si un script 'typecheck' existe)
        run: npm run typecheck --if-present

  storybook:
    name: Storybook Chain
    needs: security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: releasee
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check if src/ has changed
        id: check_src
        run: |
          git fetch origin main
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^src/' || true)
          else
            CHANGED="true"
          fi
          echo "changed=$([[ -n \"$CHANGED\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check_src.outputs.changed == 'true'
        run: npm ci

      - name: Build Storybook
        if: steps.check_src.outputs.changed == 'true'
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: steps.check_src.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
          retention-days: 1 # [CHANGEMENT] Ajout d'une rétention courte pour nettoyer rapidement l'artefact GitHub Pages

      - name: Deploy to GitHub Pages
        if: steps.check_src.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  package:
    name: Package Publish
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@mairie360'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # [CHANGEMENT] Remplacement du bump de patch arbitraire par semantic-release :
      # la version est désormais calculée à partir des commits conventionnels
      # (feat/fix/BREAKING CHANGE), comme pour les APIs et BFFs.
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/semantic-tag

      - name: Set package version
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: npm version "${{ steps.set_tag.outputs.new_release_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to GitHub Packages
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: npm publish --access public

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - lint
      - build
      - test
      - security
      - storybook
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify-cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
