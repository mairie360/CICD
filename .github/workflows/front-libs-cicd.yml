name: Reusable CI/CD Pipeline

on:
  workflow_call:
    inputs:
      cicd_version:
        required: true
        type: string
        description: "Ref (tag) du repo mairie360/CICD pour les actions composites"
      semgrep_config:
        required: false
        type: string
        default: "p/typescript p/react p/secrets p/github-actions cicd-repo/tests/semgrep/gdpr"
        description: "Semgrep rulesets (space-separated) run by the SAST job"
      semgrep_fail_on_findings:
        required: false
        type: boolean
        default: false
        description: "Fail the pipeline on Semgrep findings (report-only by default until the existing findings are triaged, see README)"
      rgaa_min_rate:
        required: false
        type: number
        default: 60
        description: "Minimum CI RGAA rate (percent) of the automatically decided criteria; below it the accessibility job fails (MAIR-319)"
      rgaa_ai_model:
        required: false
        type: string
        default: "claude-sonnet-5-5"
        description: "Claude model of the RGAA AI pre-audit (MAIR-320); the pre-audit only runs when the ANTHROPIC_API_KEY secret is set"
    secrets:
      CODECOV_TOKEN:
        required: true
      N8N_WEBHOOK_SECRET:
        required: true
      # [NOUVEAU] MAIR-320: optional; without it the RGAA AI pre-audit is skipped.
      ANTHROPIC_API_KEY:
        required: false
      # [NOUVEAU] MAIR-320: only when the API key is not scoped to a workspace.
      ANTHROPIC_WORKSPACE_ID:
        required: false

permissions:
  contents: read

jobs:
  dependencies:
    name: Install & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Install & Security Audit
        uses: ./cicd-repo/actions/dependencies/front-lib

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run linter
        uses: ./cicd-repo/actions/lint/front-lib

  build:
    name: Build library
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Build package
        uses: ./cicd-repo/actions/build/front-lib
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # [CHANGEMENT] Runs in parallel with `build` (tests do not use its artifact).
    needs: dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Run Tests
        uses: ./cicd-repo/actions/unit-tests/front-lib
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # [NOUVEAU] MAIR-493: the job's steps are a composite action of this repo; only `actions/`
      # is checked out, so that the consumer's tools (`eslint .`, jest, cargo...) never see it.
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo
          sparse-checkout: actions

      - name: Security & Quality Checks
        uses: ./cicd-repo/actions/security/front-lib

  # [NOUVEAU] MAIR-230: Semgrep SAST through the shared `semgrep` composite action (pinned image).
  security_sast:
    name: Code Security Audit (Semgrep, Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Gitleaks scans the commits of the push / PR

      - name: Checkout CICD repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Run Semgrep Security Scan
        uses: ./cicd-repo/actions/security/semgrep
        with:
          config: ${{ inputs.semgrep_config }}
          fail_on_findings: ${{ inputs.semgrep_fail_on_findings }}

      # [NOUVEAU] MAIR-416: secret scan of the new commits.
      - name: Run Gitleaks Secret Scan
        uses: ./cicd-repo/actions/security/gitleaks

  # [NOUVEAU] MAIR-317 (epic MAIR-297): plays the stories declared in the lib's `rgaa.yaml` with the
  # RGAA engine of `cicd-repo/tests/a11y`, at release time only: on `main`, once the unit tests
  # pass, before `package` publishes (the fronts are checked by the `rgaa` job of promote-prod.yml). The static
  # Storybook is served on a private Docker network as `http://storybook:6006` (the `target` of the
  # lib's rgaa.yaml).
  accessibility_tests:
    name: Accessibility Tests (RGAA)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the accessibility scope
        run: |
          if [ ! -f rgaa.yaml ]; then
            echo "::error title=RGAA::rgaa.yaml is missing: the lib declares the RGAA scope of its stories (see the mairie360/CICD README, \"RGAA scope\")"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      # [NOUVEAU] MAIR-320: AI verdicts by element fingerprint, kept between runs so that only new or
      # changed elements are sent to Claude (until the n8n store, MAIR-275, holds them).
      - name: Restore RGAA AI verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .rgaa-ai-cache
          key: rgaa-ai-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rgaa-ai-${{ github.repository }}-

      - name: Run accessibility tests on the stories
        timeout-minutes: 15
        env:
          RGAA_MIN_RATE: ${{ inputs.rgaa_min_rate }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          RGAA_AI_MODEL: ${{ inputs.rgaa_ai_model }}
        run: |
          mkdir -p rgaa-report .rgaa-ai-cache
          docker network create rgaa
          docker run -d --name storybook --network rgaa -v "$PWD/storybook-static:/site:ro" \
            python:3-alpine python -m http.server 6006 --directory /site
          docker run --rm --network rgaa --user "$(id -u):$(id -g)" -e RGAA_MIN_RATE -e ANTHROPIC_API_KEY -e ANTHROPIC_WORKSPACE_ID -e RGAA_AI_MODEL \
            -v "$PWD/.rgaa-ai-cache:/ai-cache" \
            -v "$PWD/cicd-repo/tests/a11y:/engine:ro" \
            -v "$PWD/rgaa.yaml:/scope/rgaa.yaml:ro" \
            -v "$PWD/rgaa-report:/report" \
            "$(cat cicd-repo/tests/a11y/runner-image)" sh /engine/run.sh

      - name: Save RGAA AI verdicts
        if: always() && hashFiles('.rgaa-ai-cache/verdicts.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .rgaa-ai-cache
          key: rgaa-ai-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Job summary
        if: always()
        run: |
          if [ -f rgaa-report/summary.md ]; then
            cat rgaa-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RGAA report (the runner did not start, see the logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload RGAA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rgaa-report
          path: rgaa-report/
          if-no-files-found: ignore

      - name: Dump Storybook server logs
        if: failure()
        run: docker logs storybook 2>&1 | tail -50 || true

  storybook:
    name: Storybook Chain
    needs: [security, security_sast, accessibility_tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: releasee
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Check if src/ has changed
        id: check_src
        run: |
          git fetch origin main
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^src/' || true)
          else
            CHANGED="true"
          fi
          echo "changed=$([[ -n \"$CHANGED\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check_src.outputs.changed == 'true'
        run: npm ci

      - name: Build Storybook
        if: steps.check_src.outputs.changed == 'true'
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: steps.check_src.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: storybook-static
          retention-days: 1 # [CHANGEMENT] Ajout d'une rétention courte pour nettoyer rapidement l'artefact GitHub Pages

      - name: Deploy to GitHub Pages
        if: steps.check_src.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  package:
    name: Package Publish
    needs: [test, security, security_sast, accessibility_tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@mairie360'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # [CHANGEMENT] Remplacement du bump de patch arbitraire par semantic-release :
      # la version est désormais calculée à partir des commits conventionnels
      # (feat/fix/BREAKING CHANGE), comme pour les APIs et BFFs.
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Calculate & Create Tag
        id: set_tag
        uses: ./cicd-repo/actions/release/semantic-tag

      - name: Set package version
        if: steps.set_tag.outputs.new_release_published == 'true'
        run: npm version "${{ steps.set_tag.outputs.new_release_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to GitHub Packages
        if: steps.set_tag.outputs.new_release_published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public

  notify-cicd-failure:
    name: Notify n8n on failure
    if: failure()
    needs:
      - dependencies
      - lint
      - build
      - test
      - security
      - security_sast
      - accessibility_tests
      - storybook
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CICD Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mairie360/CICD
          ref: ${{ inputs.cicd_version }}
          path: cicd-repo

      - name: Notify n8n
        uses: ./cicd-repo/actions/notify/cicd-failure
        with:
          n8n_webhook_secret: ${{ secrets.N8N_WEBHOOK_SECRET }}
