# GDPR Semgrep rules of the mairie360 CI (MAIR-291, epic MAIR-284). Run by the `security_sast` job
# of every stack workflow (`semgrep_config` default: cicd-repo/tests/semgrep/gdpr), tested by
# `semgrep --test` (the file of the same name next to it, lint.yml).
#
# Rule of the epic: a log describes an error by its type and context, never by the value it
# received. The GDPR log marker test (tests/gdpr/marker) proves it at run time; these rules catch
# the obvious cases at review time. A finding that is a false positive gets a `nosemgrep: <rule id>`
# comment with the reason.
rules:
  - id: gdpr-ts-log-personal-value
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      This log line prints a personal or secret value (e-mail, password, token, request body).
      Log the type of the error and an id instead (MAIR-290); see the GDPR log marker test.
    metadata:
      category: security
      references: ["https://mairie-360.atlassian.net/browse/MAIR-291"]
    patterns:
      - pattern-either:
          - pattern: console.$METHOD(..., $ARG, ...)
          - patterns:
              - pattern: $LOGGER.$METHOD(..., $ARG, ...)
              - metavariable-regex:
                  metavariable: $LOGGER
                  regex: ^(logger|log|winston|pino|this\.logger)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(log|info|warn|error|debug|trace|fatal)$
      # An identifier or a member (`email`, `req.body`, `user.password`, `accessToken`), a shorthand
      # property of an object literal, or an interpolation in a template literal.
      - metavariable-pattern:
          metavariable: $ARG
          pattern-either:
            - pattern-regex: (?s)^(?:(?:[\w$]+\??\.)*(?:email|password|token|body|accessToken|refreshToken)\b(?!\s*\()|\{.*\b(?:email|password|token|body|accessToken|refreshToken)\b\s*[,}])
            - patterns:
                - pattern-either:
                    - pattern: "`...${$OBJECT.$VALUE}...`"
                    - pattern: "`...${$VALUE}...`"
                - metavariable-regex:
                    metavariable: $VALUE
                    regex: ^(?:email|password|token|body|accessToken|refreshToken)$
