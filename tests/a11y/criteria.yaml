# RGAA 4.1.2 criteria and how the engine tests them (MAIR-318). Testing logic only: which
# criteria apply to a front is declared in its own rgaa.yaml.
#
# level:    automation level of the Mairie 360 checklist (Checklist_RGAA_Mairie360.pdf):
#            auto (a tool decides), semi (a tool finds failures, a human confirms the rest),
#            manual (human judgement).
# checks:   axe:<rule> (axe-core rule) or scenario:<id> (scenarios.mjs).
# coverage: full    - the checks cover the whole checklist line: their verdict is final;
#           partial - a failing check invalidates the criterion, a pass still needs a review;
#           none    - no automated check, always reviewed.
# A semi or manual criterion moves to `coverage: full` once its checks cover its checklist.
