name: "Publish OpenAPI from Rust"
description: "Extrait le contrat d’une API Rust et publie les types TS"

inputs:
  version:
    required: true
    description: "Version du package à publier"
  package_name:
    required: true
    description: "Nom du package à publier"
  dist_tag:
    required: false
    description: "npm dist-tag à utiliser (ex: dev, staging, ou vide pour latest)"
    default: "latest"
  token:
      required: true
      description: "Token d'authentification pour npm"
  # [NOUVEAU] MAIR-999: release-dev passes the spec the `build` job generated, so the API is not
  # compiled again here. Empty: `cargo open_api` (fallback of the promotions).
  spec_file:
    required: false
    default: ""
    description: "OpenAPI spec already generated (JSON); empty runs `cargo open_api`"

runs:
  using: "composite"
  steps:
    # [CHANGEMENT] Ajout de l'action setup-node pour s'assurer d'avoir un environnement
    # Node.js propre et stable avant d'exécuter des commandes npm/npx.
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "24"

    - shell: bash
      env:
        SPEC_FILE: ${{ inputs.spec_file }}
        # [CHANGEMENT] Les entrées passent par l'environnement, jamais interpolées dans le script
        # (injection de template : une valeur attaquante s'exécuterait comme du shell).
        PACKAGE_NAME: ${{ inputs.package_name }}
        PACKAGE_VERSION: ${{ inputs.version }}
        NPM_TOKEN: ${{ inputs.token }}
        DIST_TAG: ${{ inputs.dist_tag }}
        REPO_OWNER: ${{ github.repository_owner }}
      run: |
        # [CHANGEMENT] Ajout de 'set -e' pour faire échouer le workflow immédiatement
        # en cas d'erreur dans le script bash (évite les publications partielles).
        set -e

        ORG=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
        SAFE_NAME=$(echo "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')

        # 1. Nettoyer tout ancien build pour éviter les résidus
        rm -rf ./generated
        mkdir -p ./generated

        # 2. The spec: the one given (MAIR-999), else generated from Rust. orval.config.js of the
        #    APIs reads ./openapi.json.
        if [ -n "$SPEC_FILE" ]; then
          if [ ! -s "$SPEC_FILE" ]; then
            echo "::error::OpenAPI spec not found or empty: '$SPEC_FILE'"
            exit 1
          fi
          # `cp` refuses to copy a file onto itself: skip it when the spec already is ./openapi.json
          # (same file by identity, so absolute paths and aliases count too).
          if [ ! "$SPEC_FILE" -ef openapi.json ]; then
            cp "$SPEC_FILE" openapi.json
          fi
        else
          cargo open_api > openapi.json
        fi

        # [CHANGEMENT] Suppression du 'npm install orval -D' à chaque run qui ralentit l'action.
        # Utilisation de 'npx -y orval' pour exécuter l'outil proprement sans installation locale superflue.
        npx -y orval

        # 5. Créer le package.json directement DANS generated
        cat <<EOF > generated/package.json
        {
          "name": "@${ORG}/${SAFE_NAME}-openapi",
          "version": "${PACKAGE_VERSION}",
          "main": "./index.ts",
          "types": "./index.ts",
          "dependencies": {
            "axios": "^1.0.0"
          },
          "publishConfig": {
            "registry": "https://npm.pkg.github.com"
          }
        }
        EOF

        # 6. Configuration NPM locale au dossier de publication
        echo "@${ORG}:registry=https://npm.pkg.github.com" > generated/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> generated/.npmrc

        # 7. PUBLICATION : L'étape cruciale
        cd generated
        npm publish --access restricted --tag "$DIST_TAG"
