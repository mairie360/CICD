name: "Semantic Tag & Release"
description: "Calcule la version, crée le tag et la release GitHub via Semantic Release"

# [NOUVEAU] MAIR-491: dry_run computes the version without tagging (release_folder gate).
inputs:
  dry_run:
    description: "'true' to compute the next version without creating the tag nor the release"
    required: false
    default: "false"

outputs:
  new_release_published:
    description: "true si une nouvelle version est publiée"
    value: ${{ steps.semantic.outputs.new_release_published }}
  new_release_version:
    description: "La version calculée (ex: 1.2.0)"
    value: ${{ steps.semantic.outputs.new_release_version }}
  last_release_git_tag:
    description: "Le tag de la dernière release (ex: v1.2.0), vide sans release précédente"
    value: ${{ steps.semantic.outputs.last_release_git_tag }}

runs:
  using: "composite"
  steps:
    # [CHANGEMENT] Ajout de l'action setup-node pour garantir une version stable de Node.js
    # au lieu d'utiliser l'environnement global implicite du runner.
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    # [NOUVEAU] release/release-journal commits RELEASE_JOURNAL.md on main after the dev and
    # staging releases of this same commit, so main is always ahead of it here, and
    # semantic-release publishes nothing from a branch that is behind its remote. Fast-forward
    # over those commits when they are the only ones ahead (they change nothing but the journal):
    # the tag then lands on the last journal commit, same code as the tested one. Any other
    # commit ahead keeps the previous behaviour (no release from this run).
    - name: Skip the release journal commits
      shell: bash
      env:
        JOURNAL: RELEASE_JOURNAL.md
      run: |
        branch="${GITHUB_REF#refs/heads/}"
        git rev-parse --verify --quiet HEAD >/dev/null || exit 0
        git fetch --quiet origin "$branch" || exit 0
        remote="$(git rev-parse FETCH_HEAD)"
        if [ "$remote" = "$(git rev-parse HEAD)" ] || ! git merge-base --is-ancestor HEAD "$remote"; then
          exit 0
        fi
        other_commits="$(git log --format=%s "HEAD..$remote" | grep -v '^docs(release-journal):' || true)"
        other_files="$(git diff --name-only HEAD "$remote" | grep -vxF "$JOURNAL" || true)"
        if [ -z "$other_commits" ] && [ -z "$other_files" ]; then
          git merge --ff-only --quiet "$remote"
          echo "Fast-forwarded over the release journal commits to ${remote::7}."
        fi

    - name: Semantic Release
      id: semantic
      uses: cycjimmy/semantic-release-action@v8.1.4
      with:
        dry_run: ${{ inputs.dry_run }}
        extra_plugins: |
          semantic-release-cargo
          conventional-changelog-conventionalcommits@7.0.2
      env:
        GITHUB_TOKEN: ${{ github.token }}
