name: "Unit tests (BFFs)"
description: >-
  `npm test` of a BFF, then the Codecov upload of `coverage/lcov.info` on main and on PRs to main
  (`test` job of BFFs-cicd.yml).

inputs:
  node_version:
    description: "Node.js version (the workflow input node_version)"
    required: true
  npm_scope:
    description: "npm scope hosted on GitHub Packages (the workflow input npm_scope)"
    required: true
  node_auth_token:
    description: "Token for the GitHub Packages registry (the caller passes secrets.GITHUB_TOKEN)"
    required: true
  codecov_token:
    description: "Codecov upload token (the caller passes secrets.CODECOV_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm
        registry-url: https://npm.pkg.github.com
        scope: ${{ inputs.npm_scope }}

    - shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}

    - shell: bash
      run: npm test

    - name: Upload Coverage to Codecov
      if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
      uses: codecov/codecov-action@v7
      with:
        token: ${{ inputs.codecov_token }}
        files: coverage/lcov.info
        # [CHANGEMENT] MAIR-467: Codecov only reports coverage, so an outage on its side (expired
        # certificate on 2026-10-05) must not fail the job and block the release.
        fail_ci_if_error: false
