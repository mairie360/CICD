name: "Unit tests (fronts)"
description: >-
  `npm test` of a Next.js front, then the Codecov upload of `coverage/lcov.info` on main and on
  PRs to main (`test` job of frontend-cicd.yml).

inputs:
  node_version:
    description: "Node.js version (the workflow input node_version)"
    required: true
  node_auth_token:
    description: "Token for the GitHub Packages registry (the caller passes secrets.GITHUB_TOKEN)"
    required: true
  codecov_token:
    description: "Codecov upload token (the caller passes secrets.CODECOV_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    - name: Install Dependencies
      shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}

    # [CHANGEMENT] MAIR-416: no more `--if-present`, a front without a test script fails CI.
    - shell: bash
      run: npm test

    - name: Upload Coverage to Codecov
      if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
      uses: codecov/codecov-action@v7
      with:
        token: ${{ inputs.codecov_token }}
        files: coverage/lcov.info
        fail_ci_if_error: false
