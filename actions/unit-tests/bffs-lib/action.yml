name: "Unit tests (bffs-lib)"
description: >-
  `npm test` of the npm library shared by the BFFs (its jest config enforces the coverage
  thresholds), then the Codecov upload on main and on PRs to main (`test` job of
  bffs-lib-cicd.yml).

inputs:
  codecov_token:
    description: "Codecov upload token (the caller passes secrets.CODECOV_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # The repo's jest config collects coverage and enforces its own thresholds.
    - name: Run tests
      shell: bash
      run: npm test

    - name: Upload Coverage to Codecov
      if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
      uses: codecov/codecov-action@v7
      with:
        token: ${{ inputs.codecov_token }}
        files: coverage/lcov.info
        # [CHANGEMENT] MAIR-467: Codecov only reports coverage, so an outage on its side (expired
        # certificate on 2026-10-05) must not fail the job and block the release.
        fail_ci_if_error: false
