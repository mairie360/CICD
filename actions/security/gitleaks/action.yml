name: "Gitleaks"
description: >
  Scans the commits added by the current push or pull request for leaked secrets with a pinned
  Gitleaks image (the gitleaks-action needs a paid license on organizations). Only the new commits
  are scanned, so a secret already in the history does not fail every later build: rotate it,
  then add its fingerprint to a `.gitleaksignore` at the root of the calling repo. When the base
  is unknown (new branch, force-push), every commit not on the default branch is scanned, or the
  whole history if there is none (`log-opts.sh`, MAIR-677). Inline `gitleaks:allow` comments are
  ignored: only `.gitleaksignore` and the config's allowlists can silence a finding, and both are
  read from the pull request's base or the default branch, never from the scanned commits
  (`policy.sh`, MAIR-677): a change to them applies once merged. Without a `.gitleaks.toml` there,
  the action's `gitleaks.toml` is used (built-in rules plus allowlists for known test values, e.g.
  the test `jwt_secret` of `rgaa.yaml`).
  The caller must check the repository out with `fetch-depth: 0`.

inputs:
  fail_on_findings:
    description: "'true' fails the job when a secret is found, 'false' only reports it"
    required: false
    default: "true"
  image:
    description: "Gitleaks image, pinned by version AND digest. Bump both together."
    required: false
    default: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"

runs:
  using: "composite"
  steps:
    - name: Run Gitleaks
      shell: bash
      env:
        GITLEAKS_IMAGE: ${{ inputs.image }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        LOG_OPTS_SCRIPT: ${{ github.action_path }}/log-opts.sh
        POLICY_SCRIPT: ${{ github.action_path }}/policy.sh
        DEFAULT_CONFIG: ${{ github.action_path }}/gitleaks.toml
      run: |
        set -uo pipefail
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          base="$PR_BASE_SHA"
        else
          base="$PUSH_BEFORE"
        fi
        # MAIR-677: new branch, force push or unknown base: every commit not on the
        # default branch, or the whole history, never the tip alone.
        log_opts=$("$LOG_OPTS_SCRIPT" "$base" "$GITHUB_SHA" "$DEFAULT_BRANCH") || exit 2
        echo "Scanning commits: $log_opts"

        exit_code=1
        [ "$FAIL_ON_FINDINGS" = "true" ] || exit_code=0
        # MAIR-677: config and ignore list from the base / default branch, never from the
        # scanned commits, and a scan of a clone without a working tree, where Gitleaks finds
        # no `.gitleaksignore` of its own to load.
        cd "$GITHUB_WORKSPACE"
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          policy_base="$PR_BASE_SHA"
        else
          policy_base=""
        fi
        policy_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-policy.XXXXXX")
        scan_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-scan.XXXXXX")
        trusted=$("$POLICY_SCRIPT" "$policy_base" "$DEFAULT_BRANCH" "$policy_dir" "$DEFAULT_CONFIG") || exit 2
        echo "Gitleaks policy from: ${trusted:-the action defaults}"
        git clone -q --mirror "$GITHUB_WORKSPACE" "$scan_dir/repo.git" || exit 2
        # Same uid as the checkout, otherwise git refuses the repo ("dubious ownership").
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$scan_dir/repo.git:/repo:ro" \
          -v "$policy_dir:/policy:ro" \
          -w /repo \
          "$GITLEAKS_IMAGE" \
          git /repo \
            --config /policy/gitleaks.toml \
            --gitleaks-ignore-path /policy/.gitleaksignore \
            --log-opts="$log_opts" \
            --redact \
            --ignore-gitleaks-allow \
            --no-banner \
            --exit-code "$exit_code"
        code=$?
        if [ "$code" -ne 0 ]; then
          echo "::error title=Gitleaks::secret(s) found in the new commits (or Gitleaks failed, exit code $code): rotate them first, see the log above"
        fi
        rm -rf "$policy_dir" "$scan_dir"
        exit "$code"
