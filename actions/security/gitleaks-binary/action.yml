name: Frontend verified Gitleaks
description: Scan frontend commits with the verified published Gitleaks 8.30.1 binary.
inputs:
  fail_on_findings:
    description: Findings fail when true; scanner errors retain their nonzero exit.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Run the verified redacted frontend secret scan
      shell: bash
      env:
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        LOG_OPTS_SCRIPT: ${{ github.action_path }}/../gitleaks/log-opts.sh
        POLICY_SCRIPT: ${{ github.action_path }}/../gitleaks/policy.sh
        GOMAXPROCS: '1'
      run: |
        set -euo pipefail
        frontend_gitleaks_directory=$(mktemp -d "$RUNNER_TEMP/frontend-gitleaks.XXXXXX")
        curl --fail --show-error --location \
          --output "$frontend_gitleaks_directory/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$frontend_gitleaks_directory/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf "$frontend_gitleaks_directory/gitleaks.tar.gz" -C "$frontend_gitleaks_directory" gitleaks

        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          base="$PR_BASE_SHA"
        else
          base="$PUSH_BEFORE"
        fi
        # MAIR-677: never the tip alone when the base is unknown (see log-opts.sh).
        log_opts=$("$LOG_OPTS_SCRIPT" "$base" "$GITHUB_SHA" "$DEFAULT_BRANCH")
        echo "Scanning commits: $log_opts"
        exit_code=1
        [ "$FAIL_ON_FINDINGS" = "true" ] || exit_code=0
        # MAIR-677: config and ignore list from the base / default branch, scan of a clone without a
        # working tree (see policy.sh).
        cd "$GITHUB_WORKSPACE"
        policy_base=""
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          policy_base="$PR_BASE_SHA"
        fi
        trusted=$("$POLICY_SCRIPT" "$policy_base" "$DEFAULT_BRANCH" "$frontend_gitleaks_directory/policy")
        echo "Gitleaks policy from: ${trusted:-the built-in rules}"
        config_args=()
        [ -f "$frontend_gitleaks_directory/policy/gitleaks.toml" ] && config_args=(--config "$frontend_gitleaks_directory/policy/gitleaks.toml")
        git clone -q --mirror "$GITHUB_WORKSPACE" "$frontend_gitleaks_directory/repo.git"
        set +e
        "$frontend_gitleaks_directory/gitleaks" git "$frontend_gitleaks_directory/repo.git" \
          "${config_args[@]}" --gitleaks-ignore-path "$frontend_gitleaks_directory/policy/.gitleaksignore" \
          --log-opts="$log_opts" --redact --ignore-gitleaks-allow --no-banner --exit-code "$exit_code"
        code=$?
        set -e
        if [ "$code" -ne 0 ]; then
          echo "::error title=Gitleaks::secret(s) found in the new commits (or Gitleaks failed, exit code $code); see the redacted scan log"
        fi
        exit "$code"
