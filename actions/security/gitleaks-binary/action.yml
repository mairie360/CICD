name: Frontend verified Gitleaks
description: Scan frontend commits with the verified published Gitleaks 8.30.1 binary.
inputs:
  fail_on_findings:
    description: Findings fail when true; scanner errors retain their nonzero exit.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Run the verified redacted frontend secret scan
      shell: bash
      env:
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        GOMAXPROCS: '1'
      run: |
        set -euo pipefail
        frontend_gitleaks_directory=$(mktemp -d "$RUNNER_TEMP/frontend-gitleaks.XXXXXX")
        curl --fail --show-error --location \
          --output "$frontend_gitleaks_directory/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$frontend_gitleaks_directory/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf "$frontend_gitleaks_directory/gitleaks.tar.gz" -C "$frontend_gitleaks_directory" gitleaks

        zero=0000000000000000000000000000000000000000
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          base="$PR_BASE_SHA"
        else
          base="$PUSH_BEFORE"
        fi
        if [ -n "$base" ] && [ "$base" != "$zero" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
          log_opts="$base..$GITHUB_SHA"
        else
          log_opts="-1 $GITHUB_SHA"
        fi
        echo "Scanning commits: $log_opts"
        exit_code=1
        [ "$FAIL_ON_FINDINGS" = "true" ] || exit_code=0
        set +e
        "$frontend_gitleaks_directory/gitleaks" git "$GITHUB_WORKSPACE" \
          --log-opts="$log_opts" --redact --no-banner --exit-code "$exit_code"
        code=$?
        set -e
        if [ "$code" -ne 0 ]; then
          echo "::error title=Gitleaks::secret(s) found in the new commits (or Gitleaks failed, exit code $code); see the redacted scan log"
        fi
        exit "$code"
