name: "Security and license audit (back-lib)"
description: >-
  `cargo audit` and `cargo deny check advisories licenses` of the Rust library (`security_audit`
  job of back-lib-cicd.yml).

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run Cargo Audit (Vulnerability Check)
      shell: bash
      run: |
        cargo install cargo-audit --locked
        cargo audit

    - name: Run Cargo Deny (License & Advisory Check)
      shell: bash
      run: |
        cargo install cargo-deny --locked
        cargo deny check advisories licenses
