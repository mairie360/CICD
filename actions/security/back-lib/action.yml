name: "Security and license audit (back-lib)"
description: >-
  `cargo audit` and `cargo deny check advisories licenses` of the Rust library (`security_audit`
  job of back-lib-cicd.yml).

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

    # MAIR-1002: only `main` writes the cache. A pull request cache (refs/pull/<n>/merge) cannot be read by
    # any other run but counts against the 10 GB quota, so each pull request evicted the `main` caches.
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Run Cargo Audit (Vulnerability Check)
      shell: bash
      run: |
        cargo install cargo-audit --locked
        cargo audit

    - name: Run Cargo Deny (License & Advisory Check)
      shell: bash
      run: |
        cargo install cargo-deny --locked
        cargo deny check advisories licenses
