name: "Build (APIs)"
description: >-
  Release build of a Rust API, uploaded with its OpenAPI spec as the `api-assets` artifact that the
  release jobs download (`build` job of APIs_cicd.yml).

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # MAIR-1002: only `main` writes the cache. A pull request cache (refs/pull/<n>/merge) cannot be read by
    # any other run but counts against the 10 GB quota, so each pull request evicted the `main` caches.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build Project
      shell: bash
      run: cargo build --release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: api-assets
        path: |
          target/release/
          openapi-spec.json
        retention-days: 1 # [CHANGEMENT] Limitation de la rétention pour économiser l'espace
