name: "OpenAPI spec (APIs)"
description: >-
  Generates the OpenAPI spec of a Rust API once (`cargo open_api`) and uploads it as the
  `openapi-spec` artifact that the GDPR contract check and the dev release read (`build` job of
  APIs_cicd.yml).

# [CHANGEMENT] MAIR-999: no more `cargo build --release` + upload of `target/release/`. Nobody read
# that artifact: the image is compiled by the Dockerfile in release-dev, and clippy (lint) and the
# instrumented tests (unit_test) already check that the crate compiles. The spec used to be
# compiled three times (here, gdpr_contract and publish-openapi-rust): it is now generated here only.
runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

    # MAIR-1002: only `main` writes the cache. A pull request cache (refs/pull/<n>/merge) cannot be read by
    # any other run but counts against the 10 GB quota, so each pull request evicted the `main` caches.
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Generate the OpenAPI spec
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/openapi"
        cargo open_api > "$RUNNER_TEMP/openapi/openapi.json"
        if ! jq -e '.openapi and .paths' "$RUNNER_TEMP/openapi/openapi.json" > /dev/null; then
          echo "::error::cargo open_api did not print an OpenAPI document"
          exit 1
        fi

    - name: Upload the spec
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: openapi-spec
        path: ${{ runner.temp }}/openapi/openapi.json
        if-no-files-found: error
        retention-days: 1
