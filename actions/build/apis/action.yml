name: "Build (APIs)"
description: >-
  Release build of a Rust API, uploaded with its OpenAPI spec as the `api-assets` artifact that the
  release jobs download (`build` job of APIs_cicd.yml).

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Build Project
      shell: bash
      run: cargo build --release

    - name: Upload Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: api-assets
        path: |
          target/release/
          openapi-spec.json
        retention-days: 1 # [CHANGEMENT] Limitation de la rétention pour économiser l'espace
