name: "Build (back-lib)"
description: >-
  Release build of the Rust library, uploaded as `build-artifact` (`build` job of
  back-lib-cicd.yml).

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # MAIR-1002: only `main` writes the cache. A pull request cache (refs/pull/<n>/merge) cannot be read by
    # any other run but counts against the 10 GB quota, so each pull request evicted the `main` caches.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build
      shell: bash
      run: cargo build --release

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-artifact
        path: target/release/
        retention-days: 1
