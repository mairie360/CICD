name: "Build (fronts)"
description: "`npm run build` of a Next.js front (`build` job of frontend-cicd.yml)."

inputs:
  node_version:
    description: "Node.js version (the workflow input node_version)"
    required: true
  node_auth_token:
    description: "Token for the GitHub Packages registry (the caller passes secrets.GITHUB_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    - name: Install Dependencies
      shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}

    - shell: bash
      run: npm run build
