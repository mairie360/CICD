name: "Build (front-lib)"
description: >-
  `npm run build` of the React component library, uploaded as `library-dist` (`build` job of
  front-libs-cicd.yml).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build package
      shell: bash
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: library-dist
        path: dist/
        retention-days: 1
