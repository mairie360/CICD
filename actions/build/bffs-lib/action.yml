name: "Build (bffs-lib)"
description: >-
  `npm run build` of the npm library shared by the BFFs, uploaded as `library-dist` (`build`
  job of bffs-lib-cicd.yml).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # `npm run build` runs `tsc`, so it also type-checks the library.
    - name: Build package
      shell: bash
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: library-dist
        path: dist/
        retention-days: 1
