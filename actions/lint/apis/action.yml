name: "Lint (APIs)"
description: "Clippy with warnings denied on a Rust API (`lint` job of APIs_cicd.yml)."

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    # [CHANGEMENT] Utilisation de la commande cargo standard au lieu de l'action-rs/cargo
    - name: Run lint check
      shell: bash
      run: cargo clippy -- -D warnings
