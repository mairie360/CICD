name: "Lint (bffs-lib)"
description: "`npm run lint` of the npm library shared by the BFFs (`lint` job of bffs-lib-cicd.yml)."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Run linter
      shell: bash
      run: npm run lint
