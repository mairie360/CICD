name: "Lint (back-lib)"
description: "The consumer's `cargo lint_check` alias on the Rust library (`lint` job of back-lib-cicd.yml)."

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run lint check
      shell: bash
      run: cargo lint_check
