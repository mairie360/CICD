name: "Lint (front-lib)"
description: "`npm run lint` of the React component library (`lint` job of front-libs-cicd.yml)."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Run linter
      shell: bash
      run: npm run lint
