name: "Lint (BFFs)"
description: "`npm run lint` of a BFF (`lint` job of BFFs-cicd.yml)."

inputs:
  node_version:
    description: "Node.js version (the workflow input node_version)"
    required: true
  npm_scope:
    description: "npm scope hosted on GitHub Packages (the workflow input npm_scope)"
    required: true
  node_auth_token:
    description: "Token for the GitHub Packages registry (the caller passes secrets.GITHUB_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm
        registry-url: https://npm.pkg.github.com
        scope: ${{ inputs.npm_scope }}

    - shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}

    - shell: bash
      run: npm run lint
