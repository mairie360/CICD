name: "Performance tests (APIs)"
description: >-
  k6 load test of a Rust API through the consumer's `performance_test.sh`, with the OpenAPI coverage
  gate (`tests/k6/coverage.js`) (`performance_isolated` job of APIs_cicd.yml). Runs against the
  published `dev-<sha_tag>` image given in `image_ref`. The caller logs in to GHCR first, keeps the
  15 min step timeout on the step that uses this action and dumps the container logs on failure
  (`integration/container-logs`).

inputs:
  image_ref:
    description: "Image under test, `<image>:dev-<sha_tag>` from the release-dev outputs (exported as IMAGE_REF)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run Performance Tests via Docker Compose
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
      run: |
        # `--exit-code-from k6-perf-test` fails the job when k6 exceeds its thresholds,
        # including the `operations_uncovered` one of the coverage gate.
        ./performance_test.sh
