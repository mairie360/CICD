name: 'Publish OpenAPI from TypeScript'
description: 'Génère le paquet TypeScript depuis le contrat d’un BFF TS et le publie (même format que publish-openapi-rust)'

inputs:
  version:
    required: true
    description: 'Version du package à publier'
  package_name:
    required: true
    description: 'Nom du package à publier'
  dist_tag:
    required: false
    description: "npm dist-tag à utiliser (ex: dev, staging, ou vide pour latest)"
    default: "latest"
  token:
    required: true
    description: 'Token d authentification GitHub'
  spec_file:
    required: true
    description: 'Chemin du contrat OpenAPI (JSON) exporté par le BFF'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Générer le paquet TypeScript
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        VERSION: ${{ inputs.version }}
        SPEC_FILE: ${{ inputs.spec_file }}
        GENERATE: ${{ github.action_path }}/../openapi-package/generate.sh
      run: |
        set -euo pipefail
        ORG=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
        SAFE_NAME=$(echo "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')
        bash "$GENERATE" "$SPEC_FILE" "$PWD/generated" "@${ORG}/${SAFE_NAME}-openapi" "$VERSION"

    - name: Publier le paquet
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        DIST_TAG: ${{ inputs.dist_tag }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        ORG=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
        # Configuration NPM locale au dossier de publication
        # (le token reste dans l'env, npm résout ${NODE_AUTH_TOKEN} au publish)
        printf '%s\n' \
          "@${ORG}:registry=https://npm.pkg.github.com" \
          '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
          > "$PWD/generated/.npmrc"
        cd generated
        npm publish --access restricted --tag "$DIST_TAG"
