name: "Publish OpenAPI from Rust"
description: "Extrait le contrat d’une API Rust et publie les types TS"

inputs:
  version:
    required: true
    description: "Version du package à publier"
  package_name:
    required: true
    description: "Nom du package à publier"
  token:
    required: true
    description: "Token d'authentification pour npm"

runs:
  using: "composite"
  steps:
    # [CHANGEMENT] Ajout de l'action setup-node pour s'assurer d'avoir un environnement
    # Node.js propre et stable avant d'exécuter des commandes npm/npx.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - shell: bash
      run: |
        # [CHANGEMENT] Ajout de 'set -e' pour faire échouer le workflow immédiatement
        # en cas d'erreur dans le script bash (évite les publications partielles).
        set -e

        ORG=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        SAFE_NAME=$(echo "${{ inputs.package_name }}" | tr '[:upper:]' '[:lower:]')

        # 1. Nettoyer tout ancien build pour éviter les résidus
        rm -rf ./generated
        mkdir -p ./generated

        # 2. Générer le JSON depuis Rust
        cargo open_api > openapi.json

        # [CHANGEMENT] Suppression du 'npm install orval -D' à chaque run qui ralentit l'action.
        # Utilisation de 'npx -y orval' pour exécuter l'outil proprement sans installation locale superflue.
        npx -y orval

        # 5. Créer le package.json directement DANS generated
        cat <<EOF > generated/package.json
        {
          "name": "@${ORG}/${SAFE_NAME}-openapi",
          "version": "${{ inputs.version }}",
          "main": "./index.ts",
          "types": "./index.ts",
          "dependencies": {
            "axios": "^1.0.0"
          },
          "publishConfig": {
            "registry": "https://npm.pkg.github.com"
          }
        }
        EOF

        # 6. Configuration NPM locale au dossier de publication
        echo "@${ORG}:registry=https://npm.pkg.github.com" > generated/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.token }}" >> generated/.npmrc

        # 7. PUBLICATION : L'étape cruciale
        cd generated
        npm publish --access restricted
