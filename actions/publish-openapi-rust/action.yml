name: "Publish OpenAPI from Rust"
description: "Extrait le contrat d’une API Rust et publie le paquet TypeScript"

inputs:
  version:
    required: true
    description: "Version du package à publier"
  package_name:
    required: true
    description: "Nom du package à publier"
  dist_tag:
    required: false
    description: "npm dist-tag à utiliser (ex: dev, staging, ou vide pour latest)"
    default: "latest"
  token:
      required: true
      description: "Token d'authentification pour npm"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Extraire le contrat et générer le paquet TypeScript
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        VERSION: ${{ inputs.version }}
        GENERATE: ${{ github.action_path }}/../openapi-package/generate.sh
      run: |
        set -euo pipefail
        ORG=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
        SAFE_NAME=$(echo "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')
        # Le contrat vient de l'API elle-même ; la configuration orval est celle du script partagé,
        # pas l'orval.config.js du dépôt, pour que tous les paquets aient le même contenu.
        cargo open_api > openapi.json
        bash "$GENERATE" openapi.json "$PWD/generated" "@${ORG}/${SAFE_NAME}-openapi" "$VERSION"

    - name: Publier le paquet
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        DIST_TAG: ${{ inputs.dist_tag }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        ORG=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
        printf '%s\n' \
          "@${ORG}:registry=https://npm.pkg.github.com" \
          '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
          > "$PWD/generated/.npmrc"
        cd generated
        npm publish --access restricted --tag "$DIST_TAG"
