name: "Dependencies (bffs-lib)"
description: >-
  `npm ci` and `npm audit --audit-level=high` of the npm library shared by the BFFs (`dependencies` job of bffs-lib-cicd.yml).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Check dependencies vulnerabilities (npm audit)
      shell: bash
      run: npm audit --audit-level=high
