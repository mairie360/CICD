name: "Dependencies (bffs-lib)"
description: >-
  `npm ci` and `npm audit --audit-level=high` of the npm library shared by the BFFs (`dependencies` job of bffs-lib-cicd.yml).
  The audit fails the job on production dependencies only (`--omit=dev`); the full audit, development tools
  included, is reported as a warning with the report in the job summary.

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # [CHANGEMENT] Only production dependencies (what ships in the published package)
    # fail the job, like the fronts and front-libs: picomatch GHSA-fc5q-39xc-vjpf
    # has no fixed version and only reaches the BFFs through jest and typescript-eslint.
    - name: Check production dependencies vulnerabilities (npm audit --omit=dev)
      shell: bash
      run: npm audit --omit=dev --audit-level=high

    # [NOUVEAU] Full audit (development tools included), never blocking. It also runs when the
    # production audit failed (`!cancelled()`), so the job summary shows everything, and publishes the
    # report as soon as it holds a vulnerability, whatever its severity.
    - name: Report development dependencies vulnerabilities (npm audit, non-blocking)
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        report="$RUNNER_TEMP/npm-audit-full.txt"
        npm audit > "$report" 2>&1 || true
        if grep -q "found 0 vulnerabilities" "$report"; then
          echo "No vulnerability, development tools included."
        else
          if npm audit --audit-level=high > /dev/null 2>&1; then
            echo "::notice title=npm audit (development tools)::Vulnerabilities below the high level in development dependencies (not blocking, see the job summary)."
          else
            echo "::warning title=npm audit (development tools)::High or critical vulnerabilities in development dependencies (not blocking, see the job summary)."
          fi
          {
            echo "### npm audit, development tools included (not blocking)"
            echo '```'
            head -c 60000 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
