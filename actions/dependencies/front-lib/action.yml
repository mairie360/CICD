name: "Dependencies (front-lib)"
description: >-
  `npm ci` and `npm audit --audit-level=high` of the React component library (`dependencies` job of front-libs-cicd.yml).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Check dependencies vulnerabilities (npm audit)
      shell: bash
      run: npm audit --audit-level=high
