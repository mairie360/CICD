name: "Dependencies (front-lib)"
description: >-
  `npm ci` and `npm audit --audit-level=high` of the React component library (`dependencies` job of front-libs-cicd.yml).
  The audit fails the job on production dependencies only (`--omit=dev`); the full audit, development tools
  included, is reported as a warning with the report in the job summary (#161).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # [CHANGEMENT] #161 : seules les dependances de production (ce que la lib publie dans `dist/`)
    # font echouer le job. Les outils de developpement (lint, tests...) sont audites a part, sans
    # bloquer, pour que leurs failles restent visibles dans le resume du job.
    - name: Check production dependencies vulnerabilities (npm audit --omit=dev)
      shell: bash
      run: npm audit --omit=dev --audit-level=high

    # [NOUVEAU] #161 : audit complet (outils de developpement inclus), jamais bloquant. Il tourne aussi
    # quand l'audit de production a echoue (`!cancelled()`), pour que le resume du job montre tout, et il
    # publie le rapport des qu'il contient une faille, quelle que soit sa gravite.
    - name: Report development dependencies vulnerabilities (npm audit, non-blocking)
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        report="$RUNNER_TEMP/npm-audit-full.txt"
        npm audit > "$report" 2>&1 || true
        if grep -q "found 0 vulnerabilities" "$report"; then
          echo "No vulnerability, development tools included."
        else
          if npm audit --audit-level=high > /dev/null 2>&1; then
            echo "::notice title=npm audit (development tools)::Vulnerabilities below the high level in development dependencies (not blocking, see the job summary)."
          else
            echo "::warning title=npm audit (development tools)::High or critical vulnerabilities in development dependencies (not blocking, see the job summary)."
          fi
          {
            echo "### npm audit, development tools included (not blocking)"
            echo '```'
            head -c 60000 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
