name: "Dependencies (BFFs)"
description: >-
  Node.js setup and `npm ci` of a BFF against GitHub Packages (`dependencies` job of
  BFFs-cicd.yml); with `audit: 'true'`, also `npm audit --audit-level=high` (`security_audit`
  job).

inputs:
  node_version:
    description: "Node.js version (the workflow input node_version)"
    required: true
  npm_scope:
    description: "npm scope hosted on GitHub Packages (the workflow input npm_scope)"
    required: true
  node_auth_token:
    description: "Token for the GitHub Packages registry (the caller passes secrets.GITHUB_TOKEN)"
    required: true
  audit:
    description: "'true' to run npm audit after the install (blocks on high/critical)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm
        registry-url: https://npm.pkg.github.com
        scope: ${{ inputs.npm_scope }}

    - shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}

    - name: Run npm audit (Block on High/Critical)
      if: inputs.audit == 'true'
      shell: bash
      run: npm audit --audit-level=high
