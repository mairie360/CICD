name: "Dependencies (BFFs)"
description: >-
  Node.js setup and `npm ci` (or the cached node_modules, MAIR-1009) of a BFF against GitHub Packages (`dependencies` job of
  BFFs-cicd.yml); with `audit: 'true'`, also `npm audit --audit-level=high` (`security_audit`
  job).

inputs:
  node_version:
    description: "Node.js version (the workflow input node_version)"
    required: true
  npm_scope:
    description: "npm scope hosted on GitHub Packages (the workflow input npm_scope)"
    required: true
  node_auth_token:
    description: "Token for the GitHub Packages registry (the caller passes secrets.GITHUB_TOKEN)"
    required: true
  audit:
    description: "'true' to run npm audit after the install (blocks on high/critical)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # [CHANGEMENT] MAIR-1009: node_modules comes from the cache keyed on package-lock.json and the
    # Node version; `npm ci` only runs when it changed.
    - name: Install dependencies (cached)
      uses: ./cicd-repo/actions/dependencies/node-install
      with:
        node_version: ${{ inputs.node_version }}
        npm_scope: ${{ inputs.npm_scope }}
        node_auth_token: ${{ inputs.node_auth_token }}
        save: 'true'

    - name: Run npm audit (Block on High/Critical)
      if: inputs.audit == 'true'
      shell: bash
      run: npm audit --audit-level=high
