name: "Dependencies (back-lib)"
description: >-
  Rust toolchain, `cargo fetch` and a release `cargo check` that pre-compiles the dependencies of
  the Rust library (`dependencies` job of back-lib-cicd.yml).

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Download Dependencies
      shell: bash
      run: cargo fetch

    - name: Pre-compile dependencies
      shell: bash
      run: cargo check --release
